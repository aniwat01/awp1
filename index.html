G:[["1) Parts of Speech","Noun = ชื่อคน/สัตว์/สิ่งของ/สถานที่ (lark, nest). Verb = การกระทำ (climbed). Adjective = ขยาย noun บอกว่าเป็นแบบไหน อยู่หน้า noun หรือหลัง be (the huge tree / the tree was huge). วิธีทำ: หา verb ก่อน แล้วถามว่าคำไหนขยาย noun"],["2) Simple Past","สูตร V2 / didn't + V1 / Did + S + V1? ปกติ+ed: call→called. ไม่ปกติ: go→went, make→made, take→took, grow→grew, hear→heard, wake→woke, fall→fell, feel→felt, win→won, think→thought. Be: was/were. คำใบ้: yesterday, ago, last night, once upon a time"],["3) Past Continuous","สูตร was/were + V-ing บอกการกระทำที่กำลังเกิดอยู่ในอดีต. ใช้กับ while; เหตุการณ์ที่มาแทรกเป็น Simple Past. While he was cutting, his axe slipped."],["4) Simple Future","สูตร will + V1 (ปฏิเสธ will not / won't). คำใบ้: tomorrow, next week, soon. The lion will help the fox."],["5) Superlatives","adj สั้น: the + adj+est (tall→tallest, big→biggest, friendly→friendliest). adj ยาว: the most + adj (the most beautiful). พิเศษ: good→best, bad→worst. ต้องมี the เสมอ"]],

const D={"1": {"l": ["Once upon a time, a little bird called a lark made her nest in a field of young rice.|กาลครั้งหนึ่ง นกน้อยชื่อลาร์กทำรังในทุ่งข้าวอ่อน", "As the days passed, the rice stalks grew tall, and the young birds also grew in strength.|เมื่อวันเวลาผ่านไป ต้นข้าวสูงขึ้น และลูกนกก็แข็งแรงขึ้นด้วย", "Then one day, when the ripe golden grains of rice waved in the breeze, the farmer and his son entered the field.|วันหนึ่ง ขณะรวงข้าวสีทองสุกงอมโบกไหวตามลม ชาวนากับลูกชายก็เข้ามาในทุ่ง", "\"This rice is now ready for harvesting,\" said the farmer. \"We must call in our neighbors and friends to help us harvest it.\"|\"ข้าวนี้พร้อมเก็บเกี่ยวแล้ว\" ชาวนากล่าว \"เราต้องเรียกเพื่อนบ้านและเพื่อนๆ มาช่วยเกี่ยว\"", "The young larks in their nest close by were very frightened, for they knew they would be in great danger if they did not leave before the farmers arrived.|ลูกนกในรังใกล้ๆ ตกใจกลัวมาก เพราะรู้ว่าจะอยู่ในอันตรายใหญ่หากไม่ออกไปก่อนชาวนามาถึง", "When the mother lark returned with food for them, they shared what they had heard.|เมื่อแม่นกกลับมาพร้อมอาหาร ลูกๆ ก็เล่าสิ่งที่ได้ยินให้ฟัง", "\"Do not be frightened, children,\" said the mother lark. \"If the farmer said he would call in his neighbors and friends to help him, this rice will not be reaped for a while yet.\"|\"อย่ากลัวเลยลูก\" แม่นกพูด \"ถ้าชาวนาบอกว่าจะเรียกเพื่อนบ้านและเพื่อนมาช่วย ข้าวนี้ก็ยังไม่ถูกเกี่ยวในเร็วๆ นี้หรอก\"", "A few days later, the rice was so ripe that when the wind shook the stalks, a hail of rice grains came rustling down on the young larks' heads.|อีกไม่กี่วันต่อมา ข้าวสุกมากจนเมื่อลมพัดต้นข้าวไหว เมล็ดข้าวก็ร่วงกราวลงบนหัวลูกนกราวห่าฝน", "\"If this rice is not harvested at once,\" said the farmer, \"we will lose half of the crop. We cannot wait any longer for help from our friends. Tomorrow we must set to work ourselves.\"|\"ถ้าไม่เก็บเกี่ยวทันที เราจะเสียผลผลิตไปครึ่งหนึ่ง เรารอความช่วยเหลือจากเพื่อนอีกไม่ได้แล้ว พรุ่งนี้เราต้องลงมือทำเอง\" ชาวนากล่าว", "When the young larks told their mother what they had heard that day, she said: \"Then we must leave at once. When a person decides to do their own work and not depend on anyone else, then you may be sure there will be no more delay.\"|เมื่อลูกนกเล่าให้แม่ฟัง แม่ก็พูดว่า \"ถ้างั้นเราต้องออกไปเดี๋ยวนี้ เมื่อใครตัดสินใจทำงานของตัวเองและไม่พึ่งใคร เมื่อนั้นจะไม่มีการล่าช้าอีกแน่นอน\"", "There was much fluttering and trying out of wings that afternoon, and at sunrise the next day, when the farmer and his son cut down the stalks of grain, they found an empty nest.|บ่ายวันนั้นมีเสียงกระพือปีกและลองบินกันวุ่นวาย รุ่งเช้าวันถัดมาตอนชาวนากับลูกชายมาตัดต้นข้าว ก็พบแต่รังว่างเปล่า", "Self-help is the best help. When you help yourself, you learn to solve problems on your own. This makes you stronger and more independent. So, it is good to rely on yourself rather than waiting for others to help you.|ข้อคิด: การพึ่งตนเองคือความช่วยเหลือที่ดีที่สุด เมื่อช่วยตัวเองเราจะเรียนรู้แก้ปัญหาเอง ทำให้แข็งแกร่งและเป็นอิสระขึ้น จึงควรพึ่งตัวเองมากกว่ารอให้คนอื่นช่วย"], "v": "depend on|พึ่งพา;delay|ความล่าช้า;independent|เป็นอิสระ;rely on|พึ่งพา;flutter|กระพือปีก;danger|อันตราย;stalk|ลำต้นข้าว;self-help|การพึ่งตนเอง", "s": "เรื่องสอนว่า 'Self-help is the best help' ลำดับเรื่อง: (1) แม่นกทำรังในนาข้าว (2) ชาวนาจะเรียกเพื่อนบ้านมาเกี่ยว แม่ไม่ย้าย เพราะรอคนอื่นย่อมช้า (3) ชาวนาเรียกเพื่อนไม่ได้ จึงบอกว่าพรุ่งนี้จะทำเอง (4) แม่ให้ย้ายทันที ได้ผลคือรังว่าง. Setting: ทุ่งข้าว Characters: แม่นก ลูกนก ชาวนา ลูกชาย Conflict: อันตรายจากการเก็บเกี่ยว", "g": ["Simple Past Tense (เล่าเรื่องในอดีต)", "<b>ใช้เมื่อ:</b> เหตุการณ์เกิดและจบในอดีต<br><b>สูตร:</b> บอกเล่า = V2 | ปฏิเสธ = did not + V1 | คำถาม = Did + S + V1?<br><b>Be:</b> I/he/she/it was, you/we/they were<br><b>ตัวอย่างจากเรื่อง:</b> made(make) · grew(grow) · entered · said(say) · knew(know) · returned · shook(shake) · came(come) · told(tell) · found(find)<br><b>จำ:</b> ตัวหลัง did ต้องกลับเป็น V1 เช่น they did not leave (ไม่ใช่ did not left)<br><b>If-clause ในเรื่อง:</b> If the farmer said he would call... = ถ้าชาวนาบอกว่าจะ... (would = will ในอดีต)"], "q": [["'Self-help is the best help' means ___.", ["rely on yourself", "wait for friends", "ask neighbors", "run away"], 0], ["The farmer and his son ___ the field. (enter)", ["entered", "enter", "enters", "entering"], 0], ["The mother lark did not ___ at first.", ["leave", "left", "leaving", "leaves"], 0], ["Who finally decided to harvest the rice by himself?", ["the farmer", "the lark", "the neighbor", "the son only"], 0]]}, "2": {"l": ["Once upon a time, there was a fox who got stuck in a trap.|กาลครั้งหนึ่ง มีจิ้งจอกตัวหนึ่งติดกับดัก", "After a lot of struggling, he finally managed to escape, but sadly, he had to leave his lovely, fluffy tail behind.|หลังดิ้นรนอยู่นาน ในที่สุดก็หนีออกมาได้ แต่น่าเสียดายที่ต้องทิ้งหางฟูสวยไว้ข้างหลัง", "For a while, he stayed away from the other foxes because he was afraid they would tease him and laugh at him when he wasn't around.|อยู่พักหนึ่งมันหลบหน้าจิ้งจอกตัวอื่น เพราะกลัวว่าพวกนั้นจะล้อและหัวเราะเยาะลับหลัง", "But being alone was tough and sad, so he came up with a plan to solve his problem.|แต่การอยู่คนเดียวทั้งยากและเศร้า มันจึงคิดแผนแก้ปัญหา", "He gathered all the foxes for a meeting, saying he had something really important to share.|มันเรียกจิ้งจอกทั้งหมดมาประชุม บอกว่ามีเรื่องสำคัญจะบอก", "When they were all there, the fox without a tail stood up and talked for a while. He spoke about how having a tail could cause trouble for foxes.|เมื่อทุกตัวมาครบ จิ้งจอกไร้หางลุกขึ้นพูดอยู่พักหนึ่งว่าการมีหางอาจก่อปัญหาให้จิ้งจอกได้อย่างไร", "He told them about a story of a fox who got stuck in a fence because his tail tangled up. In another story, a fox couldn't run away fast from danger because his tail was too heavy.|มันเล่าเรื่องจิ้งจอกที่ติดรั้วเพราะหางพันกัน และอีกเรื่องที่จิ้งจอกหนีอันตรายไม่ทันเพราะหางหนักเกินไป", "The fox explained that humans hunt foxes just for their tails, which they saw as trophies.|จิ้งจอกอธิบายว่ามนุษย์ล่าจิ้งจอกเพียงเพื่อเอาหาง ซึ่งถือเป็นของที่ระลึกแห่งชัยชนะ", "The fox said these stories showed how having a tail could be dangerous and useless. So, he suggested that every fox should cut off their tail if they wanted to stay safe and alive.|มันบอกว่าเรื่องเหล่านี้แสดงว่าหางเป็นอันตรายและไร้ประโยชน์ จึงเสนอให้ทุกตัวตัดหางทิ้งหากอยากปลอดภัยและมีชีวิตรอด", "After the fox finished speaking, an older fox stood up and smiled.|หลังจิ้งจอกพูดจบ จิ้งจอกแก่ตัวหนึ่งลุกขึ้นและยิ้ม", "He said, \"Hey, master fox, could you please turn around for a moment.\"|เขาพูดว่า \"ท่านจิ้งจอก ช่วยหันหลังให้ดูสักครู่ได้ไหม\"", "When the fox without a tail turned around, the other foxes started laughing and making fun of him loudly.|เมื่อจิ้งจอกไร้หางหันหลัง จิ้งจอกตัวอื่นก็หัวเราะเยาะดังลั่น", "He realized it was pointless to keep trying to convince them to cut off their tails just because he did not have one.|มันตระหนักว่าการพยายามโน้มน้าวให้ตัดหางเพียงเพราะตัวเองไม่มีหางนั้นไร้ประโยชน์", "This story talks about self-acceptance and not allowing others to dictate your choices or break your confidence. Even though the fox tried to get others to do what he wanted, they made fun of him because of something he didn't like about himself. This story shows us how important it is to be okay with who we are and not care too much about what others think.|ข้อคิด: เรื่องนี้สอนเรื่องการยอมรับตัวเอง และไม่ปล่อยให้คนอื่นมากำหนดการตัดสินใจหรือทำลายความมั่นใจ จิ้งจอกพยายามให้คนอื่นทำตามที่ตนต้องการ แต่ถูกล้อเพราะสิ่งที่ตัวเองไม่ชอบในตัวเอง จึงควรยอมรับตัวเองและไม่ใส่ใจความเห็นคนอื่นมากเกินไป"], "v": "tease|ล้อเลียน;gather|รวบรวม;tangle|พันกัน;trophy|ของที่ระลึกแห่งชัยชนะ;suggest|เสนอ;dangerous|อันตราย;make fun of|ล้อเลียน;dictate|กำหนด", "s": "ลำดับเรื่อง: จิ้งจอกติดกับดักเสียหาง → กลัวถูกล้อจึงหลบ → เหงา จึงเรียกประชุม → พยายามโน้มน้าวให้ทุกตัวตัดหาง → จิ้งจอกแก่ให้มันหันหลัง ทุกตัวหัวเราะ → มันรู้ว่าไร้ผล. Theme: self-acceptance ยอมรับตัวเอง Conflict: ปมในใจเรื่องไม่มีหาง (internal) + ถูกล้อ (external)", "g": ["Past Simple + Linking Words (คำเชื่อม)", "<b>คำเชื่อมในเรื่อง:</b> because = เพราะ | but = แต่ | so = ดังนั้น | after = หลังจาก | when = เมื่อ | although/even though = แม้ว่า<br><b>ตัวอย่าง:</b> He stayed away because he was afraid. / Being alone was tough, so he made a plan. / After the fox finished speaking, an older fox stood up.<br><b>V2 จากเรื่อง:</b> got(get) · had(have) · stood(stand) · told(tell) · said(say) · saw(see) · came up with<br><b>ปฏิเสธ:</b> couldn't = could not, wasn't, didn't + V1"], "q": [["He stayed away ___ he was afraid they would laugh at him.", ["because", "so", "but", "or"], 0], ["Being alone was sad, ___ he came up with a plan.", ["so", "because", "although", "or"], 0], ["Who asked the fox to turn around?", ["an older fox", "the lion", "a hunter", "his mother"], 0], ["Why did the fox want the others to cut off their tails?", ["He did not want to be the only one without a tail", "Tails were heavy", "They asked him", "A hunter said so"], 0]]}, "3": {"l": ["A long time ago, there was a huge apple tree.|นานมาแล้ว มีต้นแอปเปิลต้นใหญ่ต้นหนึ่ง", "A little boy loved to come and play around it every day.|เด็กชายตัวน้อยชอบมาเล่นรอบต้นไม้ทุกวัน", "He climbed to the treetop, ate the apples, and took a nap in the shade. He loved the tree, and the tree loved to play with him.|เขาปีนขึ้นยอด กินแอปเปิล และงีบในร่มเงา เขารักต้นไม้ และต้นไม้ก็รักที่ได้เล่นกับเขา", "Time went by. The little boy grew up, and he no longer played around the tree every day.|เวลาผ่านไป เด็กชายโตขึ้นและไม่ได้มาเล่นรอบต้นไม้ทุกวันอีก", "One day, the boy returned to the tree looking sad.|วันหนึ่งเด็กชายกลับมาที่ต้นไม้ด้วยท่าทางเศร้า", "“Come and play with me,\" the tree said to the boy. “I am no longer a kid. I do not play around trees anymore,\" the boy replied. \"I want toys. I need money to buy them.\"|\"มาเล่นกับฉันสิ\" ต้นไม้ว่า \"ฉันไม่ใช่เด็กแล้ว ไม่เล่นกับต้นไม้อีกแล้ว\" เด็กชายตอบ \"ฉันอยากได้ของเล่น ต้องใช้เงินซื้อ\"", "“Sorry. I do not have any money, but you can pick all my apples and sell them. Then you will have some money.\"|\"ขอโทษนะ ฉันไม่มีเงิน แต่เธอเก็บแอปเปิลทั้งหมดไปขายได้ แล้วเธอจะมีเงิน\"", "The boy was so excited. He picked all the apples on the tree and left happily.|เด็กชายดีใจมาก เก็บแอปเปิลทั้งต้นแล้วจากไปอย่างมีความสุข", "He didn’t come back for a long time. The tree was sad.|เขาไม่กลับมาอีกนาน ต้นไม้เศร้า", "One day the boy—now a grown man—returned, and the tree was thrilled. “Come and play with me,” the tree said.|วันหนึ่ง เด็กชายที่ตอนนี้โตเป็นผู้ใหญ่กลับมา ต้นไม้ปลื้มใจมาก \"มาเล่นกับฉันสิ\"", "“I do not have time to play. I need to work and provide for my family. We need a house. Can you help me?”|\"ฉันไม่มีเวลาเล่น ต้องทำงานเลี้ยงครอบครัว เราต้องการบ้าน ช่วยฉันได้ไหม\"", "“Sorry, but I do not have a house. But you can cut off my branches to build one.\"|\"ขอโทษ ฉันไม่มีบ้าน แต่เธอตัดกิ่งของฉันไปสร้างบ้านได้\"", "So the man cut off all the tree’s branches and left happily. The tree was glad to help but was once again lonely and sad.|ชายคนนั้นตัดกิ่งทั้งหมดแล้วจากไปอย่างมีความสุข ต้นไม้ยินดีที่ได้ช่วย แต่ก็เหงาและเศร้าอีกครั้ง", "One hot summer day, the man came back, and the tree was delighted. “Come and play with me!” the tree said.|วันหนึ่งในฤดูร้อน ชายคนนั้นกลับมา ต้นไม้ดีใจมาก \"มาเล่นกับฉันสิ\"", "“I am getting old. I want to go sailing to relax. Can you give me a boat?“ said the man.|\"ฉันเริ่มแก่แล้ว อยากไปล่องเรือผ่อนคลาย ให้เรือฉันได้ไหม\" ชายคนนั้นพูด", "“Use my trunk to build your boat. You can sail far away and be happy.\"|\"ใช้ลำต้นของฉันสร้างเรือเถอะ เธอจะล่องไปไกลๆ และมีความสุข\"", "So the man cut the trunk of the tree to make a boat. He sailed away and didn’t return for a long time.|ชายคนนั้นตัดลำต้นทำเรือ แล้วแล่นจากไปและไม่กลับมาอีกนาน", "Finally, the man returned after many years.|ในที่สุดหลายปีผ่านไป ชายคนนั้นก็กลับมา", "“I’m sorry, my boy. I have nothing left for you. No more apples,” said the tree.|\"ขอโทษนะลูก ฉันไม่เหลืออะไรให้เธอแล้ว ไม่มีแอปเปิลอีกแล้ว\" ต้นไม้กล่าว", "“No problem, I have no teeth to bite,“ the man replied. “No more trunk for you to climb,” the tree said. “I am too old for that now,\" the man answered.|\"ไม่เป็นไร ฉันไม่มีฟันกัดแล้ว\" ชายตอบ \"ไม่มีลำต้นให้ปีนแล้ว\" ต้นไม้ว่า \"ฉันแก่เกินกว่าจะปีนแล้ว\" ชายตอบ", "\"I really have nothing left to give—only my dying roots,” the tree said with tears.|\"ฉันไม่เหลืออะไรจะให้จริงๆ นอกจากรากที่กำลังจะตาย\" ต้นไม้พูดทั้งน้ำตา", "“I do not need much now; I just need a place to rest. I am tired after all these years,” the man replied.|\"ตอนนี้ฉันไม่ต้องการมาก แค่ที่พักผ่อน ฉันเหนื่อยหลายปีมานี้แล้ว\" ชายตอบ", "“Good! Old tree roots are the best place to lean on and rest. Come sit down with me and rest.”|\"ดีเลย! รากต้นไม้เก่าคือที่พิงและพักที่ดีที่สุด มานั่งพักกับฉันเถอะ\"", "The man sat down, and the tree was happy—smiling through its tears.|ชายคนนั้นนั่งลง ต้นไม้มีความสุข ยิ้มทั้งน้ำตา", "Moral of the story: This is a story of everyone. The tree is like our parents. When we were young, we loved spending time with them. As we grow older, we visit only when we need something. Still, our parents give us everything they can just to make us happy. You may think the boy is cruel to the tree, but in many ways this reflects how we treat our parents. We take them for granted and often realize their true value only when it is too late. 37|ข้อคิด: ต้นไม้เหมือนพ่อแม่ ตอนเด็กเรารักการอยู่กับท่าน พอโตขึ้นก็มาหาเมื่อต้องการบางอย่าง แต่ท่านก็ให้ทุกอย่างเพื่อให้เรามีความสุข เด็กชายอาจดูใจร้าย แต่สะท้อนวิธีที่เราปฏิบัติต่อพ่อแม่ เรามองข้ามคุณค่าของท่านจนสายเกินไป"], "v": "thrilled|ตื่นเต้นดีใจ;delighted|ดีใจมาก;lonely|เหงา;trunk|ลำต้น;roots|ราก;provide for|เลี้ยงดู;sail|ล่องเรือ;lean on|พิง;take for granted|มองข้ามคุณค่า;relax|ผ่อนคลาย", "s": "ต้นไม้ให้ทุกอย่างเด็กชายตลอดชีวิต: แอปเปิล (ซื้อของเล่น) → กิ่ง (สร้างบ้าน) → ลำต้น (ทำเรือ) → เหลือแต่ราก เป็นที่พักตอนแก่. Moral: ต้นไม้คือพ่อแม่ เรามักกลับไปหาเมื่อต้องการ และเห็นค่าเมื่อสายเกินไป. Setting: ต้นแอปเปิลต้นใหญ่ ตลอดช่วงชีวิต Theme: unconditional love", "g": ["Simple Past + Time Expressions", "<b>คำบอกเวลาในเรื่อง:</b> a long time ago · one day · time went by · finally · after many years<br><b>ปกติ (+ed):</b> loved, climbed, returned, picked, sailed<br><b>ไม่ปกติ:</b> eat→ate · take→took · grow→grew · go→went · cut→cut (เหมือนเดิม) · sit→sat · come→came · leave→left<br><b>ปฏิเสธ:</b> He didn't come back (didn't + V1) · I do not have = ปัจจุบัน (ในบทสนทนา)<br><b>สังเกต:</b> ส่วนเล่าเรื่องใช้อดีต แต่บทพูดของตัวละครใช้ปัจจุบัน/อนาคต"], "q": [["He ___ the apples and took a nap.", ["ate", "eat", "eaten", "eating"], 0], ["The man ___ the trunk to make a boat. (cut)", ["cut", "cutted", "cuts", "cutting"], 0], ["At the end, the old man needed ___.", ["a place to rest", "apples", "a boat", "money"], 0], ["In the moral, the tree is like our ___.", ["parents", "teachers", "friends", "pets"], 0]]}, "4": {"l": ["Once upon a time, there was a very rich family in the village. They were the wealthiest people in the country, and they had a lot of land and cattle.|กาลครั้งหนึ่ง มีครอบครัวร่ำรวยมากในหมู่บ้าน เป็นคนที่รวยที่สุดในประเทศ มีที่ดินและปศุสัตว์มากมาย", "Their food baskets were the fullest, and their clothes were made from the most colorful and expensive fabrics.|ตะกร้าอาหารของพวกเขาเต็มที่สุด และเสื้อผ้าทำจากผ้าสีสดและราคาแพงที่สุด", "However, they were not happy. In fact, they were the saddest family in the village, and no one could understand why. Wasn't their property enough to make them happy?|แต่พวกเขาไม่มีความสุข จริงๆ แล้วเป็นครอบครัวที่เศร้าที่สุดในหมู่บ้าน และไม่มีใครเข้าใจว่าทำไม ทรัพย์สินไม่พอให้มีความสุขหรือ", "They walked about with tired shoulders and sad eyes. They never laughed and their home was the quietest. Their conversations were boring and full of sadness.|พวกเขาเดินไปมาด้วยไหล่ที่ล้าและแววตาเศร้า ไม่เคยหัวเราะ บ้านเงียบที่สุด บทสนทนาน่าเบื่อและเต็มไปด้วยความเศร้า", "One day, the father, Mavuto, had an idea. He called his brother Misozi.|วันหนึ่ง พ่อชื่อมาวูโตมีความคิด เขาเรียกมิโซซี พี่/น้องชายมา", "\"I know how to solve our problems!\" Mavuto said. \"That is the craziest thing I've heard,\" Misozi replied. \"Just wait and see,\" Mavuto said with a smile.|\"ฉันรู้วิธีแก้ปัญหาของเราแล้ว!\" มาวูโตพูด \"นั่นเป็นเรื่องบ้าที่สุดที่เคยได้ยิน\" มิโซซีตอบ \"รอดูก็แล้วกัน\" มาวูโตพูดพร้อมยิ้ม", "The next day, Mavuto picked the worst piece of land near their house. It was the driest and most useless land, full of weeds and rocks.|วันรุ่งขึ้น มาวูโตเลือกที่ดินที่แย่ที่สุดใกล้บ้าน เป็นที่แห้งแล้งและไร้ประโยชน์ที่สุด เต็มไปด้วยวัชพืชและก้อนหิน", "\"I will turn this into the most beautiful garden anyone has ever seen.\"|\"ฉันจะเปลี่ยนที่นี่ให้เป็นสวนที่สวยที่สุดเท่าที่ใครเคยเห็น\"", "Mavuto started digging, removing stones, and preparing the ground for planting. Every day, he watered it and took care of it.|มาวูโตเริ่มขุด เก็บก้อนหิน และเตรียมพื้นดินสำหรับปลูก ทุกวันเขารดน้ำและดูแลมัน", "Soon, he planted the most beautiful flowers, trees and lots of vegetables.|ไม่นานเขาก็ปลูกดอกไม้ ต้นไม้ที่สวยที่สุด และผักมากมาย", "As time passed, Mavuto became the happiest he had ever been. His family noticed and joined him in the garden.|เมื่อเวลาผ่านไป มาวูโตมีความสุขที่สุดเท่าที่เคยเป็น ครอบครัวสังเกตเห็นและมาร่วมทำสวนกับเขา", "They worked together, laughed, and had the best time. Their home became the liveliest place, and they no longer argued. They became the loveliest family in the village.|พวกเขาทำงานด้วยกัน หัวเราะ และมีช่วงเวลาที่ดีที่สุด บ้านกลายเป็นที่ที่คึกคักที่สุด ไม่ทะเลาะกันอีก และเป็นครอบครัวที่น่ารักที่สุดในหมู่บ้าน", "Many years later, the family was not the wealthiest anymore, but they did not care. The garden became their most valuable treasure. They took care of it as a precious and fragile treasure.|หลายปีต่อมา ครอบครัวไม่ได้รวยที่สุดอีกแล้ว แต่ไม่สนใจ สวนกลายเป็นสมบัติล้ำค่าที่สุด พวกเขาดูแลมันเหมือนสมบัติอันมีค่าและเปราะบาง", "The most beautiful garden in the village was the secret to their happiness.|สวนที่สวยที่สุดในหมู่บ้านคือความลับแห่งความสุขของพวกเขา (ข้อคิด: ความสุขมาจากการลงมือสร้างและทำสิ่งดีๆ ร่วมกัน ไม่ใช่จากทรัพย์สิน)"], "v": "wealthy|ร่ำรวย;cattle|ปศุสัตว์;fabric|ผ้า;weed|วัชพืช;dig|ขุด;lively|คึกคัก;argue|ทะเลาะ;valuable|มีค่า;fragile|เปราะบาง", "s": "ครอบครัวมาวูโตรวยที่สุดแต่เศร้าที่สุด มาวูโตเลือกที่ดินแย่ที่สุดมาทำสวน ดูแลทุกวัน ปลูกดอกไม้ ต้นไม้ ผัก ครอบครัวมาร่วมทำสวน หัวเราะและเลิกทะเลาะ แม้ไม่ได้รวยที่สุดอีก แต่สวนกลายเป็นสมบัติและความลับของความสุข. Setting: หมู่บ้านและที่ดินใกล้บ้าน Characters: มาวูโต มิโซซี ครอบครัว Conflict: รวยแต่ไม่มีความสุข Theme: ความสุขมาจากการทำสิ่งดีร่วมกัน ไม่ใช่เงิน", "g": ["Superlatives (ขั้นสูงสุด)", "<b>ใช้เมื่อ:</b> เทียบสิ่งหนึ่งกับกลุ่มทั้งหมด ต้องมี the<br><b>สูตร:</b> คำสั้น = the + adj+est (rich→richest, sad→saddest, quiet→quietest) | คำยาว = the most + adj (the most beautiful, the most useless)<br><b>กฎสะกด:</b> ลงท้าย e เติม st (nice→nicest) | พยัญชนะ+y เปลี่ยนเป็น iest (happy→happiest, lively→liveliest, lovely→loveliest) | สระ+พยัญชนะตัวเดียวซ้ำตัวท้าย (big→biggest, sad→saddest)<br><b>พิเศษ:</b> good→best, bad→worst<br><b>จากเรื่อง:</b> the wealthiest · the fullest · the driest · the craziest · the worst · the happiest · the best · the most valuable<br><b>Past Simple ในเรื่อง:</b> had · called · picked · took · became · worked · joined"], "q": [["Mavuto picked the ___ piece of land. (bad)", ["worst", "baddest", "most bad", "worse"], 0], ["It was the ___ land near the house. (dry)", ["driest", "dryest", "most dry", "drier"], 0], ["The family was the ___ in the village. (sad)", ["saddest", "sadest", "most sad", "sader"], 0], ["Why were the family unhappy even though they were rich?", ["Money and property did not make them happy", "They had no land", "They were poor", "They had no clothes"], 0]]}, "5": {"l": ["There was once a vast forest where animals of all species lived together peacefully.|กาลครั้งหนึ่งมีป่าใหญ่ที่สัตว์ทุกชนิดอยู่ร่วมกันอย่างสงบสุข", "One day, a rabbit was settling down contentedly beneath a coconut tree for his afternoon nap when, all of a sudden, a loud, thundering sound jolted him awake.|วันหนึ่ง กระต่ายตัวหนึ่งกำลังนอนงีบบ่ายอย่างสบายใจใต้ต้นมะพร้าว ทันใดนั้นเสียงดังสนั่นก็ทำให้เขาสะดุ้งตื่น", "The rabbit thought that it must have been a landslide, so he exclaimed, \"A landslide! It's a landslide!\" as he jumped to his feet and ran for his life without looking back.|กระต่ายคิดว่าต้องเป็นดินถล่มแน่ จึงร้องสุดเสียงว่า \"ดินถล่ม!\" แล้วกระโดดลุกวิ่งหนีสุดชีวิตโดยไม่หันหลังกลับ", "The other rabbits saw him running away and shouted, \"What are you running from?\" He shouted back, \"Hurry! Run! It's a landslide!\"|กระต่ายตัวอื่นเห็นเขาวิ่งหนีจึงตะโกนถามว่า \"วิ่งหนีอะไร\" เขาตะโกนตอบว่า \"รีบหนี! ดินถล่ม!\"", "After that, panicking rabbits, numbering in the hundreds, were running behind him, screaming together all the way.|จากนั้นกระต่ายหลายร้อยตัวที่ตื่นตระหนกก็วิ่งตามเขาไปพร้อมกรีดร้องตลอดทาง", "As the other animals in the forest heard this, they, too, took off running after the rabbits.|เมื่อสัตว์อื่นในป่าได้ยิน ก็วิ่งตามกระต่ายไปด้วย", "The great lion saw all of the animals, large and small, racing toward him. He asked, \"What are you all running from?\"|สิงโตผู้ยิ่งใหญ่เห็นสัตว์ใหญ่น้อยวิ่งมาทางตน จึงถามว่า \"พวกเจ้าวิ่งหนีอะไรกัน\"", "They shouted back, \"Great Lion, there is a landslide over there, so we are running for our lives!\" and continued to flee.|พวกมันตะโกนตอบว่า \"ท่านสิงโต มีดินถล่มทางโน้น เราจึงวิ่งหนีเอาชีวิตรอด\" แล้ววิ่งต่อ", "Unknown to them, they were rushing directly toward a steep cliff.|โดยไม่รู้ตัว พวกมันกำลังวิ่งตรงไปยังหน้าผาสูงชัน", "The lion, showing compassion, ran in front of the group and roared loudly three times. This made all the animals stop running and brought them back to their senses.|สิงโตด้วยความเมตตาวิ่งไปข้างหน้าฝูงและคำรามดังสามครั้ง ทำให้สัตว์ทั้งหมดหยุดวิ่งและกลับมามีสติ", "The lion then inquired, \"Who among you saw this landslide?\" Each group passed the blame: the elephants, the tigers, the rhinoceroses, the buffalo, the boars, the deer, until the rabbits pointed at that one rabbit.|สิงโตถามว่า \"ใครเห็นดินถล่มบ้าง\" สัตว์แต่ละกลุ่มโยนต่อกันไป ช้าง เสือ แรด ควาย หมูป่า กวาง จนกระต่ายชี้ไปที่กระต่ายตัวนั้น", "The rabbit replied, \"I really heard it, Your Greatness! I was napping underneath a coconut tree, and there was a sound so loud and frightening that I immediately jumped to my feet and ran for my life!\"|กระต่ายตอบว่า \"ข้าได้ยินจริงๆ ท่านผู้ยิ่งใหญ่ ข้ากำลังงีบอยู่ใต้ต้นมะพร้าว เสียงดังน่ากลัวมาก ข้าจึงลุกวิ่งหนีทันที\"", "The lion told the animals to wait there so that he could discover the truth. \"Take me to the place from where the sound came,\" he said fearlessly.|สิงโตสั่งให้สัตว์รออยู่ที่เดิมเพื่อตนจะหาความจริง \"พาข้าไปที่ที่เกิดเสียง\" เขาพูดอย่างกล้าหาญ", "The rabbit promptly led the lion to the coconut tree. \"It was beneath that tree that I heard it,\" the rabbit said nervously.|กระต่ายรีบพาสิงโตไปที่ต้นมะพร้าว \"ข้าได้ยินเสียงใต้ต้นนี้\" กระต่ายพูดอย่างประหม่า", "The lion shook the tree with his powerful paws until a coconut came crashing loudly to the ground.|สิงโตเขย่าต้นไม้ด้วยอุ้งเท้าอันแข็งแรงจนมะพร้าวหล่นลงพื้นเสียงดัง", "\"The 'landslide' you heard was nothing but a falling coconut. From now on, you should find out the source of the sound. Do not panic and cause the others to panic with you,\" the concerned lion instructed.|\"'ดินถล่ม' ที่เจ้าได้ยินเป็นแค่มะพร้าวหล่น ต่อไปจงหาที่มาของเสียงก่อน อย่าตื่นตระหนกจนทำให้คนอื่นตื่นตระหนกตามด้วย\" สิงโตสอนอย่างห่วงใย", "The lion then went back and told all of the animals the truth, after which they dispersed and returned to their homes.|สิงโตกลับไปบอกความจริงกับสัตว์ทั้งหมด แล้วพวกมันก็แยกย้ายกลับบ้าน (ข้อคิด: ตั้งสติ หาข้อเท็จจริง ก่อนตื่นตระหนกหรือตามคนอื่น)"], "v": "vast|กว้างใหญ่;contentedly|อย่างพอใจ;landslide|ดินถล่ม;panic|ตื่นตระหนก;flee|หนี;steep cliff|หน้าผาสูงชัน;compassion|ความเมตตา;disperse|แยกย้าย", "s": "กระต่ายได้ยินเสียงมะพร้าวหล่นแล้วคิดว่าดินถล่ม วิ่งหนี สัตว์ทั้งป่าวิ่งตามโดยไม่ตรวจสอบ จนสิงโตหยุดฝูงไว้ ไล่ถามหาคนเห็นจนถึงกระต่ายตัวแรก แล้วพาไปดูจนพบว่าเป็นแค่มะพร้าวหล่น. Setting: ป่าใหญ่ ใต้ต้นมะพร้าว Characters: กระต่าย สัตว์ในป่า สิงโต Conflict: ตื่นตระหนกจากข้อมูลผิด Theme: ตั้งสติและตรวจสอบก่อนเชื่อหรือตามคนอื่น", "g": ["Past Continuous / Past Progressive", "<b>ใช้เมื่อ:</b> การกระทำที่กำลังดำเนินอยู่ ณ เวลาหนึ่งในอดีต หรือถูกเหตุการณ์อื่นมาแทรก<br><b>สูตร:</b> S + was/were + V-ing | ปฏิเสธ was/were not + V-ing | คำถาม Was/Were + S + V-ing?<br><b>was</b> = I/he/she/it, <b>were</b> = you/we/they<br><b>แทรก:</b> เหตุการณ์ที่ทำอยู่ = Past Continuous, เหตุการณ์ที่มาแทรก = Simple Past เชื่อมด้วย while/when<br><b>จากเรื่อง:</b> A rabbit was settling down... when a sound jolted him awake. / panicking rabbits were running behind him / they were rushing toward a cliff<br><b>เทคนิค:</b> while + Past Continuous, when + Simple Past (While he was sleeping, a sound woke him.)"], "q": [["A rabbit ___ under a coconut tree when a sound woke him.", ["was napping", "napped", "naps", "is napping"], 0], ["The animals ___ toward a cliff when the lion stopped them.", ["were running", "ran", "runs", "was running"], 0], ["While the rabbit ___, a coconut fell. (sleep)", ["was sleeping", "slept", "sleeps", "were sleeping"], 0], ["What did the rabbit really hear?", ["a falling coconut", "a landslide", "a tiger", "thunder"], 0]]}, "6": {"l": ["There once was a poor man who lived at the edge of a forest and chopped down trees to sell as firewood.|กาลครั้งหนึ่งมีชายยากจนอาศัยที่ชายป่า ตัดต้นไม้ขายเป็นฟืน", "One day, as he was chopping a tree by a river, he slipped, and his ax flew out of his hand and landed with a splash in the river.|วันหนึ่งขณะตัดไม้ริมแม่น้ำ เขาลื่น ขวานหลุดมือตกน้ำดังตูม", "He searched long and hard, but the ax was nowhere to be found. He sat down on the riverbank and began to cry.|เขาค้นหานานแต่ไม่พบ จึงนั่งร้องไห้ที่ริมตลิ่ง", "The spirit of the river overheard him, appeared, and said, \"Do not worry, I will find your ax for you.\"|วิญญาณแม่น้ำแอบได้ยินจึงปรากฏตัวและบอกว่า \"ไม่ต้องห่วง ข้าจะหาขวานให้\"", "He came up with a gold ax. \"Is this your ax?\" The woodcutter said, \"This one is not mine.\" Then the spirit brought up a silver ax, and again the man said, \"This ax is not mine.\"|วิญญาณนำขวานทองขึ้นมา คนตัดฟืนตอบว่าไม่ใช่ของเขา นำขวานเงินขึ้นมาก็ตอบว่าไม่ใช่เช่นกัน", "Finally, the spirit came up with the woodcutter's ax. Seeing that he was an honest man, the spirit let him keep the gold and silver axes too.|ในที่สุดวิญญาณนำขวานของเขาขึ้นมา เห็นว่าเป็นคนซื่อสัตย์ จึงให้ขวานทองและเงินด้วย", "His neighbor heard about this, went to the same river, pretended to slip, threw his ax into the water, and cried.|เพื่อนบ้านได้ยินเรื่องนี้ จึงไปที่แม่น้ำเดียวกัน แกล้งลื่น ทิ้งขวานลงน้ำแล้วร้องไห้", "When the spirit showed a gold ax, the greedy man hurriedly said, \"Yes! That is my ax!\"|เมื่อวิญญาณนำขวานทองมา คนโลภรีบตอบว่า \"ใช่ ขวานของข้า\"", "The spirit said, \"You deceitful man, you are not telling the truth.\" The greedy woodcutter did not get the golden ax and also lost his own.|วิญญาณว่า \"เจ้าคนหลอกลวง ไม่พูดความจริง\" คนโลภไม่ได้ขวานทองและเสียขวานของตัวเองไปด้วย (ข้อคิด: ซื่อสัตย์ได้ดี โลภแล้วโกหกเสียทั้งหมด)"], "v": "woodcutter|คนตัดฟืน;firewood|ฟืน;slip|ลื่น;overhear|แอบได้ยิน;appear|ปรากฏ;honest|ซื่อสัตย์;greedy|โลภ;deceitful|หลอกลวง;pretend|แกล้งทำ", "s": "คนตัดฟืนทำขวานตกน้ำ วิญญาณแม่น้ำนำขวานทองและเงินมาให้ เขาตอบตามจริงว่าไม่ใช่ จึงได้ทั้งสามเล่ม เพื่อนบ้านโลภ แกล้งทำขวานตกแล้วโกหก จึงเสียทุกอย่าง. Theme: ซื่อสัตย์ดีกว่าโลภ", "q": [["The woodcutter got all three axes because he was ___.", ["honest", "greedy", "angry", "rich"], 0], ["While the woodcutter ___ the tree, his ax slipped.", ["was chopping", "chopped", "chops", "is chopping"], 0], ["'deceitful' is closest to ___.", ["dishonest", "kind", "brave", "lazy"], 0], ["What did the greedy neighbor lose?", ["his own ax", "his house", "his dog", "his job"], 0]]}, "7": {"l": ["Many years ago, at the foothills of the Kaatskill mountains, there was a little village where a good-natured man named Rip Van Winkle lived.|นานมาแล้วที่เชิงเขาแคทสกิลล์มีหมู่บ้านเล็กๆ ที่ริป แวน วิงเกิล ชายใจดีอาศัยอยู่", "He was a kind neighbor, and the children loved him because he played with them and told them long stories.|เขาเป็นเพื่อนบ้านใจดี เด็กๆ รักเพราะเล่นด้วยและเล่านิทานยาวๆ ให้ฟัง", "The only problem was that he was very lazy. His fences were falling apart, and weeds grew on his farm.|ปัญหาเดียวคือเขาขี้เกียจมาก รั้วพัง วัชพืชขึ้นเต็มไร่", "To avoid work, he walked into the forest with his dog, Wolf. One day he reached the highest part of the mountains, lay down tired, and began daydreaming.|เพื่อเลี่ยงงาน เขาเดินเข้าป่ากับสุนัขชื่อวูล์ฟ วันหนึ่งขึ้นถึงยอดเขาและเหนื่อยจึงนอนเหม่อลอย", "A short old man with a grizzled beard called his name and asked him to help carry a barrel to a place where odd-looking men were playing ninepins in silence.|ชายแก่ตัวเตี้ยมีเคราหงอกเรียกชื่อเขาและให้ช่วยแบกถัง ไปยังที่ที่ชายแปลกๆ เล่นเกมโบว์ลิ่งกันอย่างเงียบเชียบ", "Rip was frightened, but he drank from the barrel, and slowly fell into a deep sleep.|ริปกลัวแต่ก็ดื่มจากถัง และค่อยๆ หลับลึก", "When he woke up, it was a bright morning. Wolf was gone. He went down to the village, but he did not know anyone.|เมื่อตื่นเป็นเช้าสว่าง วูล์ฟหายไป เขาลงไปที่หมู่บ้านแต่ไม่รู้จักใครเลย", "He found that his beard had grown a foot long and was white. An old woman said, \"It is Rip Van Winkle! Where have you been these twenty long years?\"|เขาพบว่าเคราขาวยาวหนึ่งฟุต หญิงแก่ร้องว่า \"ริป แวน วิงเกิล! หายไปไหนมายี่สิบปี\""], "v": "foothills|เชิงเขา;good-natured|ใจดี;lazy|ขี้เกียจ;idle|ว่างเปล่า/เกียจคร้าน;astray|หลงทาง;barrel|ถังไม้;grizzled|หงอก;tremble|สั่น;wrinkled|เหี่ยวย่น", "s": "ริปขี้เกียจแต่ใจดี หนีงานเข้าป่า พบชายแปลกหน้าและดื่มจากถัง แล้วหลับไปยี่สิบปี ตื่นมาเคราขาว หมู่บ้านเปลี่ยนไป. Setting: เชิงเขาแคทสกิลล์ Conflict: ขี้เกียจและหลับนานเกินไป", "q": [["Rip Van Winkle ___ up twenty years later.", ["woke", "wake", "wakes", "waking"], 0], ["The only problem with Rip was that he was ___.", ["lazy", "angry", "rude", "poor"], 0], ["Antonym of 'lazy'", ["hard-working", "idle", "sleepy", "slow"], 0], ["Who was Rip's dog?", ["Wolf", "Rex", "Max", "Fox"], 0]]}, "8": {"l": ["Jeremy was flying over the desert when the engine of his little plane suddenly broke down, and it crashed into the soft sand.|เจเรมีบินเหนือทะเลทรายเมื่อเครื่องยนต์เครื่องบินเล็กเสียกะทันหัน และตกลงบนทรายนุ่ม", "The plane was a complete wreck. There was nothing around but sand and sky, and the sun was very hot.|เครื่องบินพังยับ รอบตัวมีแต่ทรายกับท้องฟ้า และแดดร้อนจัด", "He had no water or food, and after hours of walking he was very thirsty.|เขาไม่มีน้ำและอาหาร เดินหลายชั่วโมงจนกระหายน้ำมาก", "He saw a shape moving closer. It was a mirage? No, it was a man on a camel.|เขาเห็นร่างเคลื่อนเข้ามา เป็นภาพลวงตา? ไม่ใช่ เป็นชายขี่อูฐ", "The elegant man wore flowing gowns and carried a suitcase. \"Perhaps you would like to buy a tie?\"|ชายสง่างามสวมเสื้อคลุมยาว ถือกระเป๋าเดินทาง ถามว่า \"อยากซื้อเนคไทไหม\"", "Jeremy begged, \"I need water!\" But the man had only ties, so he rode away.|เจเรมีอ้อนวอนขอน้ำ แต่ชายนั้นมีแต่เนคไท จึงขี่อูฐจากไป", "Later, Jeremy saw a luxurious white hotel in the middle of the desert. He went down on his knees and thanked God.|ต่อมาเจเรมีเห็นโรงแรมสีขาวหรูหรากลางทะเลทราย เขาคุกเข่าขอบคุณพระเจ้า", "At the door, the doorman said, \"I'm sorry, sir. But you can't come in here without a tie.\"|ที่ประตู พนักงานบอกว่า \"ขอโทษครับ ท่านเข้าไม่ได้ถ้าไม่มีเนคไท\" (เรื่องตลกเสียดสี: ได้ขายเนคไทตอนไม่ต้องการ พอต้องการกลับไม่มี)"], "v": "desert|ทะเลทราย;break down|เสีย;wreck|ซากพัง;mirage|ภาพลวงตา;elegant|สง่างาม;gown|เสื้อคลุมยาว;thirsty|กระหายน้ำ;luxurious|หรูหรา;doorman|พนักงานเปิดประตู", "s": "เจเรมีเครื่องบินตกกลางทะเลทราย ขาดน้ำ พบพ่อค้าเนคไทขี่อูฐที่ไม่มีน้ำ แล้วพบโรงแรมหรู แต่ถูกปฏิเสธเพราะไม่มีเนคไท. Genre: ตลก ประชดชีวิต", "q": [["The engine of the plane ___ down suddenly.", ["broke", "break", "breaks", "breaking"], 0], ["The man on the camel wanted to sell ___.", ["ties", "water", "food", "a map"], 0], ["Synonym of 'elegant'", ["stylish", "silly", "angry", "tired"], 0], ["Why couldn't Jeremy enter the hotel?", ["He had no tie", "He had no money", "It was closed", "He was too old"], 0]]}, "9": {"l": ["Once there was a young athletic boy who was obsessed with winning and measured his success only by it.|กาลครั้งหนึ่งมีเด็กชายนักกีฬาที่หมกมุ่นกับการชนะ และวัดความสำเร็จด้วยชัยชนะเท่านั้น", "One day, he prepared for a running competition in his village while a large crowd gathered. A wise old man traveled far to watch.|วันหนึ่งเขาเตรียมแข่งวิ่งในหมู่บ้าน ฝูงชนมามาก ชายชราผู้ฉลาดเดินทางไกลมาชม", "The boy won the first race and the crowd cheered, but the wise man stayed calm and silent.|เด็กชนะการแข่งครั้งแรก ฝูงชนเชียร์ แต่ชายชราสงบและเงียบ", "He won a second race against two new challengers and felt proud and important.|เขาชนะรอบสองและรู้สึกภูมิใจกับความสำคัญของตัวเอง", "The wise man brought a frail elderly lady and a blind man. The boy won easily, but the crowd was quiet.|ชายชราพาหญิงชราอ่อนแอและชายตาบอดมา เด็กชนะง่ายแต่ฝูงชนเงียบ", "\"This time, finish together,\" said the wise man. The boy took their hands and walked slowly to the finish line.|\"ครั้งนี้ จงเข้าเส้นชัยพร้อมกัน\" ชายชราว่า เด็กจูงมือทั้งสองเดินช้าๆ เข้าเส้นชัย", "The crowd cheered happily, and the wise man smiled.|ฝูงชนเชียร์อย่างสนุกสนาน และชายชรายิ้ม", "The old man said, \"Who was running next to you? It is not important if you win. It is important how you run this race.\"|ชายชราว่า \"ใครวิ่งอยู่ข้างเจ้า ไม่สำคัญว่าชนะหรือไม่ สำคัญที่เจ้าวิ่งอย่างไร\""], "v": "obsessed|หมกมุ่น;compete|แข่งขัน;witness|เป็นพยาน/ชม;commence|เริ่ม;determination|ความมุ่งมั่น;ecstatic|ดีใจสุดขีด;frail|อ่อนแอ;challenger|ผู้ท้าชิง;plead|อ้อนวอน", "s": "เด็กชายหมกมุ่นกับการชนะ ชนะสองรอบแต่ผู้คนเงียบเมื่อชนะคนอ่อนแอ ชายชราให้วิ่งด้วยกัน เด็กจูงมือเข้าเส้นชัยและได้รับเสียงเชียร์ Theme: ความสำเร็จคือการเดินไปด้วยกัน", "q": [["Antonym of 'proud'", ["ashamed", "happy", "strong", "fast"], 0], ["The boy learned success means ___.", ["finishing together", "winning alone", "running fast", "being rich"], 0], ["'ecstatic' means ___.", ["very happy", "angry", "tired", "weak"], 0], ["Who did the wise man bring for the third race?", ["an elderly lady and a blind man", "two boys", "a doctor", "his sons"], 0]]}, "10": {"l": ["Win is a university student who lives with his grandmother. She believes in many superstitions, but Win does not.|วินเป็นนักศึกษาอาศัยกับยาย ยายเชื่อโชคลางหลายอย่าง แต่วินไม่เชื่อ", "She says, \"Don't whistle at night. It brings ghosts.\" and \"If a gecko makes three sounds, something bad will happen.\"|ยายพูดว่า \"อย่าผิวปากตอนกลางคืน ผีจะมา\" และ \"ถ้าจิ้งจกทักสามครั้งจะมีเรื่องไม่ดี\"", "One evening, Win felt bored and whistled. A gecko chirped three times, the windows shook, and a cat screamed.|เย็นวันหนึ่งวินเบื่อและผิวปาก จิ้งจกทักสามครั้ง หน้าต่างสั่น แมวร้อง", "That night there were three knocks at the door, but no one was there. He said, \"It's only the wind.\"|คืนนั้นมีเสียงเคาะประตูสามครั้ง แต่ไม่มีใคร เขาบอกตัวเองว่าแค่ลม", "The next morning a black cat crossed in front of him, and a motorbike almost hit him. He jumped back and was okay.|เช้าถัดมาแมวดำเดินตัดหน้า และมอเตอร์ไซค์เกือบชน เขากระโดดหลบและปลอดภัย", "At home, Win cooked kaeng som, sang and whistled, and knocked over the salt.|ที่บ้านวินทำแกงส้ม ร้องเพลง ผิวปาก และทำเกลือหก", "His phone buzzed with a strange message: \"PREPARE YOURSELF. The wedding is tonight.\"|โทรศัพท์สั่นเป็นข้อความแปลกๆ \"เตรียมตัวให้พร้อม คืนนี้มีงานแต่ง\"", "A voice shouted, \"STOP SINGING!!!\" and the lights went out. Was it a prank, a coincidence, or something watching Win?|เสียงตะโกนว่า \"หยุดร้องเพลง\" ไฟดับ เป็นเรื่องแกล้ง บังเอิญ หรือมีบางสิ่งเฝ้าดูวิน"], "v": "superstition|โชคลาง;gecko|จิ้งจก;whistle|ผิวปาก;chirp|ร้องจิ๊บ;flicker|กะพริบ;prank|เรื่องแกล้ง;coincidence|ความบังเอิญ;spill|หก;nervous|ประหม่า", "s": "วินไม่เชื่อโชคลางของยาย แต่เกิดเหตุแปลกหลังทำตามที่ยายห้าม จบแบบคลุมเครือว่าบังเอิญหรือมีสิ่งลี้ลับ. Theme: ความเชื่อและวัฒนธรรม", "q": [["Grandma is the ___ person in the house. (wise)", ["wisest", "most wise", "wiser", "wise"], 0], ["If a gecko makes three sounds, ___.", ["something bad will happen", "you win", "it rains", "guests come"], 0], ["Win ___ at the door when he heard knocks.", ["looked", "look", "looks", "looking"], 0], ["'coincidence' means ___.", ["events happening by chance", "a plan", "a gift", "a rule"], 0]]}, "11": {"l": ["Thailand is a beautiful country with many rivers, mountains and lakes. It is hot and rainy, and farming is an important way of life.|ไทยเป็นประเทศสวยงามมีแม่น้ำ ภูเขา ทะเลสาบ ร้อนและฝนตก การเกษตรสำคัญต่อชีวิต", "This story is about a farmer's son named Jaran in Phattalung. His name means strong or brave, but his life was not always easy.|เรื่องนี้เกี่ยวกับลูกชายชาวนาชื่อจรัญที่พัทลุง ชื่อแปลว่าแข็งแรงหรือกล้าหาญ แต่ชีวิตไม่ง่ายเสมอ", "His family lived near a large river that overflowed every rainy season, but the land was fertile.|ครอบครัวอาศัยใกล้แม่น้ำใหญ่ที่ล้นตลิ่งทุกหน้าฝน แต่ดินอุดมสมบูรณ์", "Jaran was happy on the farm. He climbed coconut trees, washed the buffaloes, and loved to swim in the river.|จรัญมีความสุขที่ไร่ เขาปีนมะพร้าว ล้างควาย และชอบว่ายน้ำในแม่น้ำ", "One night, he heard a loud noise like heavy rain. His father cried, \"The flood is coming! Quick! Get up!\"|คืนหนึ่งเขาได้ยินเสียงดังเหมือนฝนตกหนัก พ่อตะโกนว่า \"น้ำท่วมมาแล้ว รีบลุก\"", "He saw the water rushing toward their house with branches and debris, and the water level was rising fast.|เขาเห็นน้ำไหลเชี่ยวมาที่บ้านพร้อมกิ่งไม้และเศษซาก ระดับน้ำสูงขึ้นเร็ว", "There was chaos outside. Jaran was terrified and could not find his parents.|ข้างนอกวุ่นวาย จรัญหวาดกลัวและหาพ่อแม่ไม่เจอ", "He ran to higher ground, slipped in the mud, found a big tree, climbed onto a thick branch, and fell asleep, not knowing what tomorrow would bring.|เขาวิ่งขึ้นที่สูง ลื่นในโคลน พบต้นไม้ใหญ่ ปีนขึ้นกิ่งใหญ่ แล้วหลับไป โดยไม่รู้ว่าพรุ่งนี้จะเป็นอย่างไร"], "v": "fertile|อุดมสมบูรณ์;overflow|ล้นตลิ่ง;rushing|ไหลเชี่ยว;current|กระแสน้ำ;debris|เศษซาก;chaos|ความวุ่นวาย;terrified|หวาดกลัวมาก;muddy|เป็นโคลน;depend on|พึ่งพา", "s": "จรัญอาศัยใกล้แม่น้ำที่ท่วมทุกฤดูฝน คืนหนึ่งน้ำท่วมใหญ่ ครอบครัวพลัดหลง เขาหนีขึ้นที่สูงและขึ้นนอนบนกิ่งไม้ Setting: พัทลุง Conflict: ภัยพิบัติน้ำท่วม", "q": [["Jaran's family lived near a ___ river.", ["large", "dry", "small", "new"], 0], ["Synonym of 'terrified'", ["very scared", "happy", "tired", "angry"], 0], ["Broken pieces after a flood are ___.", ["debris", "chaos", "fertile", "branches"], 0], ["Where did Jaran sleep?", ["on a tree branch", "in a house", "in a boat", "at school"], 0]]}, "0": {"l": ["Story grammar is like the grammar of a story. It is a set of rules that helps organize narratives.|story grammar คือไวยากรณ์ของเรื่องเล่า ชุดกฎที่ช่วยจัดโครงสร้างเรื่อง", "The main elements are characters, setting, plot, conflict, and theme.|องค์ประกอบหลักคือ ตัวละคร ฉาก โครงเรื่อง ปมปัญหา และแก่นเรื่อง", "The setting is the time and place of the story.|setting คือเวลาและสถานที่ของเรื่อง", "The plot is the sequence of events: introduction, rising action, climax, falling action, resolution.|plot คือลำดับเหตุการณ์ ได้แก่ เปิดเรื่อง เหตุการณ์ตึงเครียด จุดสูงสุด คลี่คลาย และจบ", "Conflict is a struggle. It can be internal (inside a character) or external (with others or nature).|conflict คือปัญหาหรือการต่อสู้ อาจเป็นภายในใจหรือภายนอก", "The theme or moral is the main message of the story.|theme หรือ moral คือสารสำคัญของเรื่อง"], "v": "character|ตัวละคร;rising action|เหตุการณ์ตึงเครียด;falling action|เหตุการณ์คลี่คลาย;internal|ภายใน;external|ภายนอก;moral|ข้อคิด", "s": "องค์ประกอบเรื่อง 5 อย่าง: Characters, Setting, Plot, Conflict, Theme และโครงเรื่อง: introduction → rising action → climax → falling action → resolution", "q": [["The time and place of a story is the ___.", ["setting", "theme", "conflict", "plot"], 0], ["The most exciting part is the ___.", ["climax", "introduction", "setting", "moral"], 0], ["A struggle inside a character is ___ conflict.", ["internal", "external", "universal", "plot"], 0], ["The main message of a story is the ___.", ["theme", "setting", "character", "title"], 0]]}};

const GX={"0": [["สอน: Parts of Speech (noun / verb / adjective)", "<b>Noun</b> = ชื่อคน สัตว์ สิ่งของ สถานที่ (story, plot, setting)<br><b>Verb</b> = การกระทำหรือสภาวะ (organize, helps, is)<br><b>Adjective</b> = ขยาย noun บอกลักษณะ อยู่หน้า noun หรือหลัง be (a <i>main</i> idea / The theme is <i>universal</i>)<br><b>วิธีทำข้อสอบ:</b> หา verb ก่อน → หา noun → คำที่ขยาย noun คือ adjective เช่น The brilliant stars lit up the night sky: stars=noun, lit=verb, brilliant=adj<br><b>ตัวช่วย:</b> คำลงท้าย -ful, -ous, -ive, -ic มักเป็น adjective; -tion, -ment, -ness มักเป็น noun"]], "1": [["สอน: Simple Past (กริยาอดีตแบบง่าย)", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>คำใบ้:</b> yesterday, ago, last night, once upon a time, one day<br><b>กับดัก:</b> หลัง did/didn't ต้องเป็น V1 เสมอ (did not leave ✓ / did not left ✗)<br><b>จากเรื่อง:</b> A little bird called a lark <u>made</u> her nest (make→made) · the rice <u>was</u> so ripe · the farmer and his son <u>entered</u> the field · they <u>knew</u> · rice grains <u>fell</u> · they <u>found</u> an empty nest"], ["เสริม: will (อนาคต) ที่ปรากฏในเรื่อง", "\"We <u>will lose</u> half of the crop.\" = will + V1 พูดถึงอนาคต ปฏิเสธ will not. ในเรื่องย่อหน้านี้เป็นคำพูดของชาวนา จึงใช้อนาคต ส่วนผู้เล่าใช้อดีต"]], "2": [["สอน: Simple Past + คำเชื่อม", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>คำใบ้:</b> yesterday, ago, last night, once upon a time, one day<br><b>กับดัก:</b> หลัง did/didn't ต้องเป็น V1 เสมอ (did not leave ✓ / did not left ✗)<br><b>คำเชื่อม:</b> because (เพราะ) · so (ดังนั้น) · but (แต่) · after (หลังจาก) · when (เมื่อ)<br><b>จากเรื่อง:</b> there <u>was</u> a fox who <u>got</u> stuck · he <u>stayed</u> away <b>because</b> he <u>was</u> afraid · Being alone was sad, <b>so</b> he <u>came up with</u> a plan · <b>After</b> the fox <u>finished</u> speaking, an older fox <u>stood</u> up<br><b>จำ:</b> after + Past Simple, Past Simple (ทั้งสองส่วนเป็นอดีต)"]], "3": [["สอน: Simple Past (ปกติ vs ไม่ปกติ)", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>คำใบ้:</b> yesterday, ago, last night, once upon a time, one day<br><b>กับดัก:</b> หลัง did/didn't ต้องเป็น V1 เสมอ (did not leave ✓ / did not left ✗)<br><b>ไม่ปกติจากเรื่อง:</b> eat→ate · take→took · grow→grew · go→went · sit→sat · come→came · leave→left · cut→cut (ไม่เปลี่ยน)<br><b>ปกติ:</b> loved, climbed, returned, picked, sailed<br><b>จำ:</b> ส่วนเล่าเรื่องใช้อดีต ส่วนบทสนทนา (\"I do not have any money\") ใช้ปัจจุบัน/อนาคต"], ["สอน: will ในคำพูดของต้นไม้", "\"You <u>will have</u> some money.\" = will + V1 (อนาคต) · คำใบ้: then, soon, tomorrow, next"]], "4": [["สอน: Superlatives (ขั้นสูงสุด)", "<b>ใช้:</b> เทียบสิ่งหนึ่งกับทั้งกลุ่ม ต้องมี <b>the</b> เสมอ<br><b>คำสั้น:</b> the + adj+est (rich→richest, dry→driest, sad→saddest, quiet→quietest)<br><b>คำยาว (3 พยางค์ขึ้นไป):</b> the most + adj (the most beautiful/colorful/valuable)<br><b>สะกด:</b> ลง e +st (nice→nicest) · y→iest (happy→happiest, lively→liveliest) · สั้นๆ ตัวท้ายซ้ำ (big→biggest, sad→saddest)<br><b>พิเศษ:</b> good→best · bad→worst<br><b>แบบฝึกในคู่มือ:</b> the saddest family · the most colorful clothes · the happiest · the most beautiful garden · the fullest baskets · the most boring conversations"]], "5": [["สอน: Past Continuous (Past Progressive)", "<b>ใช้:</b> การกระทำที่กำลังดำเนินอยู่ ณ เวลาหนึ่งในอดีต หรือถูกเหตุการณ์อื่นมาแทรก<br><b>สูตร:</b> S + was/were + V-ing | − was/were not + V-ing | ? Was/Were + S + V-ing?<br><b>แทรก:</b> ที่ทำอยู่ = Past Continuous, ที่มาแทรก = Simple Past ใช้ <b>while</b> + Past Continuous, <b>when</b> + Simple Past<br><b>จากเรื่อง:</b> a rabbit <u>was settling</u> down ... when a sound <u>jolted</u> him awake · panicking rabbits <u>were running</u> behind him · they <u>were rushing</u> toward a cliff<br><b>กับดัก:</b> ห้ามลืม be (was/were) · ห้ามใช้ was กับ they"]], "6": [["สอน: Past Continuous + Simple Past", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>Past Continuous:</b> was/were + V-ing สำหรับการกระทำที่ทำอยู่ถูกแทรก<br><b>จากเรื่อง:</b> As he <u>was chopping</u> the tree, he suddenly <u>slipped</u> (กำลังตัด = continuous, ลื่น = simple past) · his ax <u>flew</u> out of his hand<br><b>Will:</b> \"I <u>will find</u> your ax for you.\" (will + V1 = สัญญา/อนาคต)"]], "7": [["สอน: Simple Past ไม่ปกติ + Adjective", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>ไม่ปกติจากเรื่อง:</b> live→lived(ปกติ) · teach→taught · tell→told · lie→lay · begin→began · find→found · fall→fell · wake→woke · think→thought · see→saw · hear→heard<br><b>Adjective:</b> kind, lazy, short, old, thick, odd-looking, white ขยาย noun เช่น a <u>short, old</u> man · the <u>lazy</u> farmer<br><b>เทคนิค:</b> lazy ↔ hard-working (ตรงข้าม)"]], "8": [["สอน: Adjective และ Past Continuous", "<b>Adjective</b> ขยาย noun บอกลักษณะ: <u>elegant</u> man · <u>luxurious</u> hotel · <u>soft</u> sand · <u>thirsty</u> Jeremy · <u>hot</u> sun<br><b>ตำแหน่ง:</b> หน้า noun (an elegant man) หรือหลัง be (the sand was soft)<br><b>Past Continuous:</b> Jeremy <u>was flying</u> over the desert when the engine <u>broke</u> down. (กำลังบิน = continuous / เครื่องเสีย = simple past)<br><b>Simple Past:</b> broke · crashed · climbed · looked · saw · knocked · opened · said"]], "9": [["สอน: Simple Past (แบบฝึกในคู่มือ)", "<b>Simple Past:</b> เหตุการณ์ที่เกิดและจบในอดีต<br><b>สูตร:</b> + V2 | − did not + V1 | ? Did + S + V1?<br><b>Be:</b> was (I/he/she/it) · were (you/we/they)<br><b>ปกติ</b> +ed (call→called, carry→carried, stop→stopped) <b>ไม่ปกติ</b> ต้องจำ<br><b>จากแบบฝึกคู่มือ:</b> The boy <u>prepared</u> himself · The crowd <u>gathered</u> · The little boy <u>felt</u> (feel→felt) proud · The wise man <u>remained</u> still · The race <u>began</u>/<u>commenced</u><br><b>Superlative:</b> the best race you can ever run (good→best) · <b>Comparative:</b> much more than in any race"]], "10": [["สอน: Simple Future (will) + Superlative", "<b>Simple Future:</b> will + V1 | ปฏิเสธ will not / won't | ? Will + S + V1?<br><b>ใช้:</b> เหตุการณ์ในอนาคต คำใบ้: tomorrow, next week, soon, tonight<br><b>จากเรื่อง:</b> \"Something bad <u>will happen</u>.\" · \"The wedding is tonight.\" (คำใบ้ tonight)<br><b>Superlative:</b> Grandma is the <u>wisest</u> person in the house (wise→wisest, the + adj+est)<br><b>Simple Past ของเรื่อง:</b> Win <u>laughed</u>, <u>knocked over</u> the salt, <u>felt</u> nervous, <u>answered</u> the call"]], "11": [["สอน: Past Continuous + Simple Past", "<b>Past Continuous:</b> was/were + V-ing บอกสิ่งที่กำลังเกิดอยู่ในอดีต<br><b>จากเรื่อง:</b> People <u>were shouting</u>, <u>running</u> through the muddy water and <u>calling</u> out · the water level <u>was rising</u> fast<br><b>Simple Past:</b> heard · ran · grabbed · climbed · slipped · fell asleep<br><b>Adjective:</b> fertile land · muddy water · terrified Jaran · strong currents<br><b>กับดัก:</b> ใช้ were กับ people (พหูพจน์) · was กับ the water level (เอกพจน์)"]]};const QX={"0": [["Which word is an adjective? 'The main idea is clear.'", ["main", "idea", "is", "the"], 0], ["Which word is a verb? 'The lark built a nest.'", ["built", "lark", "nest", "the"], 0]], "1": [["Yesterday, the farmer ___ his neighbors.", ["called", "call", "calls", "calling"], 0], ["They did not ___ at first.", ["leave", "left", "leaves", "leaving"], 0]], "2": [["The fox stayed away ___ he was afraid.", ["because", "so", "but", "after"], 0], ["The fox ___ a trap.", ["got stuck in", "get stuck in", "gets stuck in", "getting stuck in"], 0]], "3": [["The boy ___ the apples. (eat)", ["ate", "eated", "eaten", "eats"], 0], ["The tree said, 'You ___ some money.'", ["will have", "had", "has", "having"], 0]], "4": [["It was the ___ garden anyone had seen.", ["most beautiful", "beautifullest", "more beautiful", "beautifuler"], 0], ["The family became the ___ in the village. (happy)", ["happiest", "most happy", "happier", "happyest"], 0]], "5": [["The lion ___ when the rabbit arrived. (rest)", ["was resting", "rested", "rests", "were resting"], 0], ["Many animals ___ toward the cliff.", ["were rushing", "was rushing", "rushed is", "rush are"], 0]], "6": [["While he ___ wood, the ax slipped.", ["was chopping", "chopped", "chops", "were chopping"], 0], ["The spirit said, 'I ___ your ax.'", ["will find", "found", "finds", "finding"], 0]], "7": [["Rip ___ his dog and walked into the forest.", ["took", "take", "takes", "taking"], 0], ["Which is an adjective?", ["lazy", "walk", "farm", "dog"], 0]], "8": [["Jeremy ___ over the desert when the engine broke down.", ["was flying", "flew is", "flies", "were flying"], 0], ["Which is an adjective? 'He met an elegant man.'", ["elegant", "met", "man", "an"], 0]], "9": [["The little boy ___ proud. (feel)", ["felt", "feeled", "feels", "feeling"], 0], ["The crowd ___ to watch the race.", ["gathered", "gather", "gathers", "gathering"], 0]], "10": [["If the gecko sounds three times, something bad ___ happen.", ["will", "did", "was", "is"], 0], ["Grandma is the ___ person. (wise)", ["wisest", "most wise", "wiser", "wise"], 0]], "11": [["People ___ and running through the water.", ["were shouting", "was shouting", "shouted is", "shouts"], 0], ["The water level ___ fast.", ["was rising", "were rising", "rise", "rising is"], 0]]};for(const k in GX){C[k].G=GX[k];C[k].q.push(...QX[k])}

C[6].l=["There once was a poor man who lived at the edge of a forest, who would often hike and chop down trees to sell as firewood.|กาลครั้งหนึ่งมีชายยากจนอาศัยที่ชายป่า มักเดินเข้าป่าไปตัดต้นไม้มาขายเป็นฟืน", "One day, he took his ax into the woods to cut down a tree on the edge of a river.|วันหนึ่งเขาถือขวานเข้าป่าไปตัดต้นไม้ริมแม่น้ำ", "As he was chopping at the tree, he suddenly slipped, and his ax flew out of his hand and landed with a splash in the river.|ขณะกำลังฟันต้นไม้ เขาลื่นกะทันหัน ขวานหลุดมือไปตกลงในแม่น้ำดังตูม", "He went into the water and searched long and hard, but the ax was nowhere to be found.|เขาลงไปในน้ำและค้นหานานแสนนาน แต่หาขวานไม่เจอเลย", "The woodcutter sat down on the riverbank and began to cry.|คนตัดฟืนนั่งลงริมตลิ่งและเริ่มร้องไห้", "The spirit of the river overheard the man's crying and appeared before him. \"Why are you crying?\" he asked.|วิญญาณแห่งแม่น้ำแอบได้ยินเสียงร้องไห้จึงปรากฏตัวต่อหน้าเขา และถามว่า \"ร้องไห้ทำไม\"", "The woodcutter replied, \"My ax flew into the water, and I cannot find it. I do not know what to do without my ax to chop wood.\"|คนตัดฟืนตอบว่า \"ขวานของข้าตกน้ำและหาไม่เจอ ข้าไม่รู้จะทำอย่างไรถ้าไม่มีขวานตัดไม้\"", "The spirit said, \"Do not worry, I will find your ax for you.\" Then he jumped into the river.|วิญญาณพูดว่า \"อย่ากังวล ข้าจะหาขวานให้เจ้าเอง\" แล้วก็กระโดดลงแม่น้ำ", "He came up from the water with a gold ax. He gave it to the woodcutter. \"Is this your ax?\"|เขาโผล่ขึ้นจากน้ำพร้อมขวานทองคำ ยื่นให้คนตัดฟืน \"นี่ใช่ขวานของเจ้าหรือไม่\"", "The woodcutter, seeing that it was not his ax, said, \"This one is not mine.\"|คนตัดฟืนเห็นว่าไม่ใช่ขวานของตน จึงบอกว่า \"อันนี้ไม่ใช่ของข้า\"", "The river spirit put down the ax and went back into the water, coming up this time with an ax made of silver.|วิญญาณแม่น้ำวางขวานลงและกลับลงน้ำ คราวนี้ขึ้นมาพร้อมขวานที่ทำจากเงิน", "The woodcutter told the river spirit, \"This ax is not mine.\" The river spirit went under the water again.|คนตัดฟืนบอกว่า \"ขวานนี้ไม่ใช่ของข้า\" วิญญาณแม่น้ำจึงดำลงน้ำอีกครั้ง", "Finally, it came up with the woodcutter's ax. When he saw this, he was very happy and said excitedly, \"That is it! That is my ax! Please give it to me!\"|ในที่สุดก็ขึ้นมาพร้อมขวานของคนตัดฟืน เขาเห็นแล้วดีใจมากและพูดอย่างตื่นเต้นว่า \"นั่นแหละ ขวานของข้า ขอได้โปรดคืนให้ข้าด้วย\"", "Then, seeing that the woodcutter was an honest man, the spirit allowed him to take the gold and silver axes in addition to the one that he had lost.|เมื่อเห็นว่าเขาเป็นคนซื่อสัตย์ วิญญาณจึงอนุญาตให้เขาเอาขวานทองและเงินไปด้วย นอกเหนือจากขวานที่ทำหาย", "When he returned home, he told his neighbor about meeting the river spirit and about the gold and silver axes he had received from him.|เมื่อกลับถึงบ้าน เขาเล่าให้เพื่อนบ้านฟังเรื่องที่พบวิญญาณแม่น้ำและขวานทองกับเงินที่ได้รับมา", "After hearing this, his neighbor headed out to the edge of the same river and started chopping at a tree.|เพื่อนบ้านได้ฟังแล้วก็ไปที่ริมแม่น้ำเดียวกันและเริ่มฟันต้นไม้", "After four or five swings, he pretended to slip and threw his ax into the water. He then sat down on the ground and began to cry.|หลังฟันสี่ห้าครั้งก็แกล้งลื่นและโยนขวานลงน้ำ จากนั้นนั่งลงกับพื้นแล้วเริ่มร้องไห้", "When the river spirit appeared, the man begged him to help him find his ax. The spirit went into the water and retrieved an ax of gold. \"Is this your ax?\"|เมื่อวิญญาณปรากฏตัว เขาอ้อนวอนให้ช่วยหาขวาน วิญญาณลงน้ำและนำขวานทองขึ้นมา \"นี่ใช่ขวานของเจ้าหรือไม่\"", "The greedy woodcutter hurriedly replied, \"Yes! Yes! That is my ax!\"|คนตัดฟืนโลภรีบตอบว่า \"ใช่ ใช่ นั่นขวานของข้า\"", "The river spirit heard the lie and said, \"You deceitful man, you are not telling the truth. This ax is not yours.\"|วิญญาณแม่น้ำได้ยินคำโกหกจึงว่า \"เจ้าคนหลอกลวง เจ้าไม่พูดความจริง ขวานนี้ไม่ใช่ของเจ้า\"", "He thus returned the golden ax to the river and disappeared.|เขาจึงคืนขวานทองลงแม่น้ำและหายตัวไป", "In the end, the greedy woodcutter did not get the golden ax and also lost his own.|ในที่สุดคนตัดฟืนโลภไม่ได้ขวานทอง และยังเสียขวานของตัวเองไปด้วย (ข้อคิด: ซื่อสัตย์ได้ดี โลภและโกหกเสียทั้งหมด)"];C[6].v="poor|ยากจน;forest|ป่า;firewood|ฟืน;ax|ขวาน;cut|ตัด;river|แม่น้ำ;splash|เสียงน้ำกระเซ็น;search|ค้นหา;spirit|วิญญาณ;gold|ทอง;silver|เงิน;deceitful|หลอกลวง;honesty|ความซื่อสัตย์;greedy|โลภ";C[10].v="superstition|ความเชื่อโชคลาง (สิ่งที่คนคิดว่าจริงโดยไม่มีหลักฐาน);whistle|ผิวปาก;gecko|จิ้งจก;knock|เคาะ (ประตู);flicker|(ไฟ)กะพริบ;message|ข้อความ;scream|กรีดร้อง;believe|เชื่อ;nervous|ประหม่า กังวล;coincidence|เรื่องบังเอิญ (ไม่ได้วางแผน);prank|เรื่องแกล้ง;chirp|ร้องจิ๊บ;spill|หก";C[11].v="fertile|อุดมสมบูรณ์ (ปลูกพืชได้ง่าย);chaos|ความวุ่นวายและเสียงดัง;debris|เศษซากที่แตกหัก;overflow|ล้นตลิ่ง;terrified|หวาดกลัวมาก;rushing|ไหลเชี่ยวรุนแรง;muddy|เป็นโคลน เปียกแฉะ;curled up|ขดตัว;branches|กิ่งไม้;struggle|ดิ้นรน ลำบาก (ขยับหรือหนี)";C[9].v+=';power|พลัง;silent|เงียบ;nod|พยักหน้า;gently|อย่างอ่อนโยน';
C[7].l=["Many years ago, at the foothills of the Kaatskill mountains, was a little village.|นานมาแล้ว ที่เชิงเขาแคทสกิลล์มีหมู่บ้านเล็กๆ แห่งหนึ่ง", "In the village lived a simple, good-natured fellow named Rip Van Winkle. He was a kind neighbor, ready to help anyone. Everyone in the village liked him.|ในหมู่บ้านมีชายใจดีเรียบง่ายชื่อริป แวน วิงเกิล เป็นเพื่อนบ้านใจดี พร้อมช่วยทุกคน ทุกคนในหมู่บ้านชอบเขา", "The children shouted with joy whenever they saw him because he played with them, taught them to fly kites and shoot marbles, and told them long stories.|เด็กๆ ร้องดีใจทุกครั้งที่เห็นเขา เพราะเขาเล่นด้วย สอนเล่นว่าวและยิงลูกแก้ว และเล่านิทานยาวๆ ให้ฟัง", "The only problem with Rip was that he was very lazy. He did no work on his own farm and just idled away his time.|ปัญหาเดียวของริปคือขี้เกียจมาก ไม่ทำงานในไร่ตัวเองและปล่อยเวลาผ่านไปเปล่าๆ", "His fences were falling to pieces. His cow was going astray. Weeds grew on his farm.|รั้วของเขาพังทลาย วัวหลงทาง และวัชพืชขึ้นเต็มไร่", "Rip's constant companion was his dog, named Wolf. To avoid work, he would walk away into the forest with his dog.|เพื่อนคู่ใจคือสุนัขชื่อวูล์ฟ เพื่อเลี่ยงงาน เขามักเดินเข้าป่าไปกับสุนัข", "One day, Rip just walked on and on and reached the highest part of the mountains. It was late in the afternoon when he got there.|วันหนึ่งริปเดินไปเรื่อยๆ จนถึงยอดเขาสูงสุด ตอนนั้นเป็นเวลาบ่ายแก่แล้ว", "Tired after his long climb, he lay down and began daydreaming. It was soon evening and he realized it would be night by the time he reached his village.|เหนื่อยจากการปีนไกล เขานอนลงและเริ่มเหม่อลอย ไม่นานก็เย็น เขาตระหนักว่ากว่าจะถึงหมู่บ้านก็คงค่ำ", "Suddenly, he heard a voice calling out, \"Rip Van Winkle, Rip Van Winkle!\"|ทันใดนั้นเขาได้ยินเสียงเรียกว่า \"ริป แวน วิงเกิล ริป แวน วิงเกิล\"", "He looked around and saw a short, old man, with thick hair and a grizzled beard walking towards him with a barrel.|เขามองไปรอบๆ และเห็นชายแก่ตัวเตี้ย ผมหนา เคราหงอก เดินมาหาพร้อมถือถัง", "He made signs to help him carry the barrel. Rip hurried to help the stranger who caught his hand tightly.|ชายนั้นทำท่าให้ช่วยแบกถัง ริปรีบไปช่วยคนแปลกหน้าผู้จับมือเขาแน่น", "Together they reached a place where there were some more odd-looking men, playing ninepins.|ทั้งสองไปถึงที่ที่มีชายหน้าตาแปลกๆ อีกหลายคนกำลังเล่นเกมไนน์พินส์ (โบว์ลิ่งแบบเก้าหลัก)", "They were all dressed the same way and all of them had beards of various shapes and colors.|ทุกคนแต่งตัวเหมือนกันและมีเคราหลายรูปทรงและสี", "Even though they were playing a game, their faces were serious and there was silence! The only sound was the noise of the balls, which echoed in the mountains like thunder.|แม้กำลังเล่นเกม สีหน้าก็จริงจังและเงียบสงัด เสียงเดียวคือเสียงลูกบอลที่ก้องในภูเขาเหมือนฟ้าร้อง", "As Rip and his companion reached them, they stopped playing and stared at Rip with a fixed gaze. Rip was really frightened.|เมื่อริปกับเพื่อนร่วมทางไปถึง พวกเขาหยุดเล่นและจ้องริปไม่กะพริบ ริปกลัวมาก", "His companion emptied the contents of the barrel into glasses and made Rip drink it. Rip obeyed as he was trembling with fear.|เพื่อนร่วมทางเทของในถังใส่แก้วและให้ริปดื่ม ริปทำตามทั้งที่ตัวสั่นด้วยความกลัว", "Since he was thirsty he drank a few more glasses and slowly fell into a deep sleep.|เพราะกระหายน้ำ เขาจึงดื่มอีกหลายแก้ว แล้วค่อยๆ หลับลึก", "On waking up, he found that he was at the place where he had first met the old man. He rubbed his eyes — it was a bright sunny morning.|เมื่อตื่นขึ้นเขาพบว่าอยู่ที่เดิมที่พบชายแก่ครั้งแรก เขาขยี้ตา เป็นเช้าแดดสดใส", "\"Surely, I have not slept here all night,\" thought Rip. He looked around for Wolf, but he was nowhere. Rip whistled for him.|\"คงไม่ได้นอนที่นี่ทั้งคืนหรอก\" ริปคิด เขามองหาวูล์ฟแต่ไม่เห็น เขาผิวปากเรียก", "\"Wolf! Wolf!\" he then shouted. No dog was to be seen. \"Where has this dog gone?\" he muttered to himself.|\"วูล์ฟ! วูล์ฟ!\" เขาตะโกน ไม่เห็นสุนัข \"หมาตัวนี้ไปไหน\" เขาบ่นกับตัวเอง", "He began to descend the mountain to go back to his village. As he neared the village, he met a number of people but he didn't know any of them.|เขาเริ่มลงเขากลับหมู่บ้าน เมื่อใกล้ถึงเขาพบคนมากมายแต่ไม่รู้จักใครเลย", "The villagers also stared at him equally surprised. \"Who is this man?\" said one. \"I've never seen him before,\" said another, \"look at his long white beard and his wrinkled face.\"|ชาวบ้านก็จ้องเขาด้วยความประหลาดใจเท่ากัน \"ชายคนนี้ใคร\" คนหนึ่งว่า \"ไม่เคยเห็นมาก่อน ดูเคราขาวยาวกับหน้าเหี่ยวย่นสิ\" อีกคนว่า", "On hearing this, Rip stroked his chin and, to his astonishment, he found his beard had grown a foot long, and it was all white!|ริปได้ยินจึงลูบคาง และพบด้วยความตกใจว่าเคราของเขายาวหนึ่งฟุตและขาวทั้งหมด", "An old woman walked up to him and looked at his face for a moment. Then she exclaimed — \"It is Rip Van Winkle! Welcome home again, old neighbor! Where have you been these twenty long years?\"|หญิงชราเดินมาดูหน้าเขาครู่หนึ่งแล้วร้องว่า \"ริป แวน วิงเกิล! ยินดีต้อนรับกลับบ้านนะเพื่อนบ้านเก่า หายไปไหนมายี่สิบปีเต็ม\" (ข้อคิด: ขี้เกียจหนีงาน เวลาผ่านไปโดยไม่รู้ตัว)"];C[7].v="foothills|เชิงเขา;good-natured|ใจดี;lazy|ขี้เกียจ;idle away|ปล่อยเวลาเปล่าประโยชน์;astray|หลงทาง;companion|เพื่อนร่วมทาง;barrel|ถังไม้;grizzled|หงอก;ninepins|เกมโบว์ลิ่งเก้าหลัก;gaze|การจ้องมอง;tremble|สั่น;obey|เชื่อฟัง;descend|ลง;wrinkled|เหี่ยวย่น;astonishment|ความตกใจ";C[8].l=["Jeremy was flying over the desert one day when the engine of his little plane suddenly broke down.|วันหนึ่งเจเรมีกำลังบินเหนือทะเลทราย เครื่องยนต์เครื่องบินเล็กก็เสียกะทันหัน", "It made that sort of noise as engines do when they start to go wrong. The plane then suddenly started to drop out of the sky - nose first - and crashed into the sand.|เครื่องส่งเสียงแบบที่เครื่องยนต์ทำเมื่อเริ่มผิดปกติ เครื่องบินจึงดิ่งหัวลงจากท้องฟ้าและตกลงบนทราย", "Fortunately for Jeremy, the sand was quite soft. But the plane was a complete wreck. It was totally destroyed.|โชคดีที่ทรายค่อนข้างนุ่ม แต่เครื่องบินพังสิ้นเชิงและถูกทำลายทั้งหมด", "Jeremy climbed out of his plane and looked around him. There was nothing there but the sand and sky.|เจเรมีปีนออกจากเครื่องบินและมองไปรอบๆ มีแต่ทรายกับท้องฟ้า", "He started walking in a direction he thought might go towards a town or village. But honestly, he didn't know where he was going.|เขาเริ่มเดินไปทางที่คิดว่าอาจไปเมืองหรือหมู่บ้าน แต่จริงๆ ไม่รู้ว่าจะไปทางไหน", "The sun was hot. It was midday, and it was in the 40s! Or perhaps in the 50s! That's 40 or 50 degrees Celsius!|แดดร้อน เป็นเวลาเที่ยง อุณหภูมิประมาณ 40 หรือ 50 องศาเซลเซียส", "He had no water, no food. And water in the desert when it's that hot is very, very important if you want to stay alive.|เขาไม่มีน้ำและอาหาร ในทะเลทรายที่ร้อนขนาดนั้น น้ำสำคัญมากถ้าอยากมีชีวิตรอด", "Several hours went by, and Jeremy just walked and walked, trying to go in one direction. But he was by now very, very thirsty.|หลายชั่วโมงผ่านไป เจเรมีเดินไปเรื่อยๆ พยายามเดินทางเดียว แต่ตอนนี้กระหายน้ำมาก", "Then, suddenly, he thought he saw something in the distance, a shape moving. Could it be a mirage?|แล้วเขาก็คิดว่าเห็นบางอย่างไกลๆ เป็นร่างเคลื่อนไหว หรือจะเป็นมิราจ (ภาพลวงตา)", "A mirage is something you see in the heat that isn't clear. Perhaps what you're looking at is not really there.|มิราจคือสิ่งที่เห็นในความร้อนซึ่งไม่ชัด สิ่งที่เห็นอาจไม่มีอยู่จริง", "The shape was getting bigger because it was coming towards him. Then he could make it out. A man on a camel, coming quite quickly.|ร่างนั้นใหญ่ขึ้นเพราะเข้ามาหา แล้วเขาก็มองออก เป็นชายขี่อูฐที่กำลังมาเร็ว", "Soon, the man came up to Jeremy on his camel. He was a very elegant looking man wearing flowing gowns (long loose clothing), with a long beard. And curiously, he had a suitcase.|ไม่นานชายคนนั้นก็มาถึง เป็นชายสง่างามสวมเสื้อคลุมยาวหลวม มีเครายาว และแปลกที่ถือกระเป๋าเดินทาง", "\"Good day, my man. How are you? Perhaps you would like to buy a tie?\" He opened his suitcase, and inside were a number of ties.|\"สวัสดี เป็นอย่างไรบ้าง บางทีคุณอาจอยากซื้อเนคไทไหม\" เขาเปิดกระเป๋า ข้างในมีเนคไทหลายเส้น", "Jeremy could hardly speak. He was so thirsty and his throat was so dry. \"Give me water. Please. I'm dying. I need water.\"|เจเรมีแทบพูดไม่ออก คอแห้งผากเพราะกระหายน้ำ \"ขอน้ำหน่อย ได้โปรด ฉันจะตายแล้ว ฉันต้องการน้ำ\"", "\"I don't have any water. But I have some lovely ties. I have green ones and blue ones and pink ones and purple ones. I have striped ones and checked ones. Or I have ties with little polka dots on them.\"|\"ฉันไม่มีน้ำ แต่มีเนคไทสวยๆ มีสีเขียว น้ำเงิน ชมพู ม่วง ลายทาง ลายตาราง หรือลายจุด\"", "Jeremy just couldn't understand. He couldn't believe his bad luck - he had met somebody in the desert, and he didn't have any water. And he wanted to sell him a tie.|เจเรมีไม่เข้าใจ ไม่อยากเชื่อว่าโชคร้าย เจอคนกลางทะเลทรายแต่ไม่มีน้ำ แถมยังจะขายเนคไทให้", "\"You silly man, can't you see? I need water!\" \"Oh dear,\" said the man. \"I'm very sorry, but I have no water.\" He put his ties away, closed the suitcase, said goodbye and rode off.|\"คนโง่ มองไม่เห็นหรือ ฉันต้องการน้ำ\" \"โอ้ ขอโทษจริงๆ ฉันไม่มีน้ำ\" เขาเก็บเนคไท ปิดกระเป๋า ลาและขี่อูฐจากไป", "Jeremy trudged on. Then suddenly, in the distance, he saw something white. Another mirage? He walked towards it.|เจเรมีเดินต่ออย่างเหนื่อยล้า แล้วเห็นสิ่งสีขาวไกลๆ ภาพลวงตาอีกหรือ เขาเดินเข้าไป", "Little by little, the white thing got bigger and bigger. It was a hotel - a beautiful, luxurious hotel right in the middle of the desert. That's just what he needed.|ค่อยๆ ใหญ่ขึ้น เป็นโรงแรมสวยหรูกลางทะเลทราย ตรงกับที่เขาต้องการพอดี", "He went down on his bended knees and said, \"Thank you, God. Thank you for sending me to this hotel.\"|เขาคุกเข่าลงแล้วพูดว่า \"ขอบคุณพระเจ้า ขอบคุณที่ส่งฉันมาที่โรงแรมนี้\"", "He got up and trudged on, and eventually arrived at the door of the hotel. He was really on his last legs, so tired he could go no further. He knocked at the door.|เขาลุกเดินต่อจนถึงประตูโรงแรม เหนื่อยจนเดินต่อไม่ไหว (on his last legs) แล้วเคาะประตู", "Almost immediately, a man opened the door, looking very elegant in a suit, a nice shirt and tie. His hair was greased and combed back, looking very smart.|ชายคนหนึ่งเปิดประตูทันที แต่งตัวสง่างามในสูท เสื้อเชิ้ตและเนคไท ผมเรียบแปล้ดูเนี้ยบ", "\"Good evening, sir. Can I help you?\" Jeremy said, \"Just let me in, please!\" The doorman said, \"I'm sorry, sir. But you can't come in here without a tie.\"|\"สวัสดีตอนเย็นครับ ให้ช่วยอะไรไหม\" เจเรมีว่า \"ให้ผมเข้าไปเถอะ\" พนักงานตอบ \"ขออภัยครับ ท่านเข้าไม่ได้ถ้าไม่มีเนคไท\""];C[8].v="desert|ทะเลทราย;break down|เสีย;wreck|ซากพัง;fortunately|โชคดีที่;mirage|ภาพลวงตา;elegant|สง่างาม;gown|เสื้อคลุมยาว;suitcase|กระเป๋าเดินทาง;thirsty|กระหายน้ำ;trudge|เดินอย่างเหนื่อยล้า;luxurious|หรูหรา;bended knees|คุกเข่า;on his last legs|เหนื่อยสุดแรง;doorman|พนักงานเปิดประตู";
C[0].l=["What is story grammar? It is like the \"grammar\" of the story.|story grammar คืออะไร คือ \"ไวยากรณ์\" ของเรื่องเล่า", "It is a set of rules that helps organize and understand how narratives, i.e., stories, are structured.|เป็นชุดกฎที่ช่วยจัดระเบียบและทำความเข้าใจโครงสร้างของเรื่องเล่า", "A story grammar can help you analyze and discuss stories more effectively.|story grammar ช่วยให้วิเคราะห์และอภิปรายเรื่องได้ดีขึ้น", "The story grammar and its elements provide a foundation for comprehension and interpretation of the story.|องค์ประกอบของ story grammar เป็นพื้นฐานของการเข้าใจและตีความเรื่อง", "1. CHARACTERS - people, animals, or even objects with human-like qualities.|1. ตัวละคร (characters) คือคน สัตว์ หรือแม้แต่สิ่งของที่มีลักษณะคล้ายมนุษย์", "2. SETTING - the time and place where the story takes place. It helps create the background and atmosphere for the events.|2. ฉาก (setting) คือเวลาและสถานที่ของเรื่อง ช่วยสร้างฉากหลังและบรรยากาศของเหตุการณ์", "3. PLOT - the sequence of events that make up the story. It includes the introduction, rising action, climax, falling action, and resolution.|3. โครงเรื่อง (plot) คือลำดับเหตุการณ์ ได้แก่ การเปิดเรื่อง เหตุการณ์ตึงเครียด จุดสูงสุด เหตุการณ์คลี่คลาย และการจบเรื่อง", "4. CONFLICT - the problem or struggle the characters face. It can be internal (within a character) or external (between characters or with the environment).|4. ปมปัญหา (conflict) คือปัญหาหรือการต่อสู้ของตัวละคร อาจเป็นภายในใจหรือภายนอก (กับตัวละครอื่นหรือสภาพแวดล้อม)", "5. THEME - the main idea or message of the story. It explores universal concepts such as love, friendship, or overcoming challenges.|5. แก่นเรื่อง (theme) คือแนวคิดหลักหรือสารของเรื่อง เช่น ความรัก มิตรภาพ หรือการเอาชนะอุปสรรค", "\"I stood high up on a small platform.\" This sentence describes the story's setting.|\"ฉันยืนอยู่สูงบนแท่นเล็กๆ\" ประโยคนี้บอก setting (ตัวอย่างข้อสอบในคู่มือ)", "Jack trades his cow for beans, plants them, climbs the beanstalk, takes the giant's treasure, and chops down the beanstalk. This is the plot summary.|แจ็คแลกวัวกับถั่ว ปลูก ปีนต้นถั่ว ขโมยสมบัติยักษ์ แล้วตัดต้นถั่ว นี่คือสรุป plot", "Three children lose their parents, live with their strange aunt, and learn to overcome grief with the love of family. This is the theme.|เด็กสามคนสูญเสียพ่อแม่ ไปอยู่กับป้า และเรียนรู้ที่จะผ่านความเศร้าด้วยความรักของครอบครัว นี่คือ theme"];C[0].v="story grammar|ไวยากรณ์ของเรื่องเล่า;narrative|เรื่องเล่า;character|ตัวละคร;setting|ฉาก (เวลา+สถานที่);plot|โครงเรื่อง;introduction|การเปิดเรื่อง;rising action|เหตุการณ์ตึงเครียด;climax|จุดสูงสุด;falling action|เหตุการณ์คลี่คลาย;resolution|การจบเรื่อง;conflict|ปมปัญหา;internal|ภายใน;external|ภายนอก;theme|แก่นเรื่อง;universal|เป็นสากล;interpretation|การตีความ";C[9].l=["Once upon a time, there was a young athletic boy who was obsessed with winning and measured his success solely by it.|กาลครั้งหนึ่งมีเด็กชายนักกีฬาที่หมกมุ่นกับการชนะ และวัดความสำเร็จด้วยการชนะเท่านั้น", "One day, the boy was preparing himself for a running competition in his small village. As he and two other young boys prepared to compete, a large crowd gathered to witness the sporting spectacle.|วันหนึ่งเขาเตรียมตัวแข่งวิ่งในหมู่บ้านเล็ก เมื่อเขากับเด็กอีกสองคนเตรียมแข่ง ฝูงชนจำนวนมากก็มาชมการแข่งขัน", "A wise old man, upon hearing of the little boy, had traveled far to bear witness.|ชายชราผู้ฉลาดได้ยินเรื่องเด็กน้อยจึงเดินทางไกลมาเป็นพยาน", "So, the race commenced, looking like a level heat at the finishing line. But sure enough, the boy dug deep and called on his determination, strength, and power.|การแข่งเริ่มขึ้น ดูสูสีที่เส้นชัย แต่เด็กทุ่มสุดตัวและรวบรวมความมุ่งมั่น แรง และพลัง", "He crossed the winning line and finished first. The crowd was ecstatic and cheered and waved at the boy.|เขาข้ามเส้นชัยเป็นที่หนึ่ง ฝูงชนดีใจสุดขีด เชียร์และโบกมือให้", "The wise man remained still, calm, and silent. The little boy, however, felt proud and important.|ชายชรายังคงนิ่ง สงบ เงียบ แต่เด็กน้อยรู้สึกภูมิใจและสำคัญ", "A second race was called, and two new young, fit challengers came forward. Once again, the little boy won and finished first.|มีการแข่งรอบสอง ผู้ท้าชิงหนุ่มแข็งแรงสองคนใหม่ออกมา เด็กชนะอีกครั้งและเข้าเป็นที่หนึ่ง", "The crowd was ecstatic again. The wise man remained still, calm, and silent. The little boy, however, felt proud and important.|ฝูงชนดีใจอีก ชายชรายังเงียบสงบ ส่วนเด็กยังภูมิใจและรู้สึกสำคัญ", "The little boy pleaded, \"Another race, another race!\" The wise old man presented two new challengers: a frail, elderly lady and a blind man.|เด็กอ้อนว่า \"แข่งอีก แข่งอีก\" ชายชรานำผู้ท้าชิงใหม่สองคนมา คือหญิงชราอ่อนแอและชายตาบอด", "\"What is this?\" quizzed the boy. \"This is no race!\" \"Race,\" said the wise man. The race was started, and the boy was the only finisher.|\"นี่อะไรกัน นี่ไม่ใช่การแข่ง\" เด็กว่า \"แข่ง\" ชายชราตอบ การแข่งเริ่มขึ้นและเด็กเป็นคนเดียวที่เข้าเส้นชัย", "The little boy was ecstatic and raised his arms in delight. But the crowd was quiet and did not react.|เด็กดีใจสุดขีดและชูแขน แต่ฝูงชนเงียบและไม่ตอบสนอง", "\"Why do not the people join in my success?\" he asked. \"Race again,\" replied the wise man. \"This time, all three of you should finish together.\"|\"ทำไมคนไม่ร่วมยินดีกับความสำเร็จของฉัน\" เด็กถาม \"แข่งอีกครั้ง คราวนี้ทั้งสามคนต้องเข้าเส้นชัยพร้อมกัน\" ชายชราว่า", "The little boy thought a little, stood in the middle, and took his two challengers by the hand. The race began, and he walked slowly, holding hands, to the finish line and crossed it.|เด็กคิดครู่หนึ่ง ยืนตรงกลางและจูงมือผู้ท้าชิงทั้งสอง การแข่งเริ่ม เขาเดินช้าๆ จับมือกันข้ามเส้นชัย", "The crowd was ecstatic, cheering and waving. The wise man smiled gently, nodding his head.|ฝูงชนดีใจ เชียร์และโบกมือ ชายชรายิ้มอย่างอ่อนโยนและพยักหน้า", "\"Little boy, for this race, you have won much more than in any race you have ever run before. The crowd cheers not for any winner.\"|\"เด็กน้อย การแข่งครั้งนี้เจ้าได้รับมากกว่าทุกครั้ง ฝูงชนไม่ได้เชียร์ผู้ชนะคนใด\"", "\"What are you running for in life? Is winning the only measure you have? If you always win against everybody, soon the people will stop cheering for you.\"|\"เจ้าวิ่งเพื่ออะไรในชีวิต การชนะคือเครื่องวัดเดียวหรือ ถ้าชนะทุกคนเสมอ ไม่นานคนจะเลิกเชียร์เจ้า\"", "\"At the end of your life, who was running next to you? If they were weaker and older, did you help them across the line? Did you all finish together?\"|\"ปลายชีวิต ใครวิ่งอยู่ข้างเจ้า ถ้าเขาอ่อนแอกว่าหรือแก่กว่า เจ้าช่วยเขาข้ามเส้นหรือไม่ เข้าเส้นชัยพร้อมกันหรือไม่\"", "\"That is the best race you can ever run. So run this race called life, but don't forget, it is not important if you win. It is important how you run this race.\"|\"นั่นคือการแข่งที่ดีที่สุด จงวิ่งการแข่งของชีวิต แต่อย่าลืมว่าชนะหรือไม่ไม่สำคัญ สำคัญที่เจ้าวิ่งอย่างไร\""];
C[10].l=["Win is a university student in Nakhon Si Thammarat. He lives with his grandmother.|วินเป็นนักศึกษามหาวิทยาลัยที่นครศรีธรรมราช เขาอาศัยอยู่กับยาย", "She believes in many superstitions, but Win doesn't believe them.|ยายเชื่อโชคลางหลายอย่าง แต่วินไม่เชื่อ", "She always tells him, \"Don't whistle at night. It brings ghosts.\"|ยายบอกเขาเสมอว่า \"อย่าผิวปากตอนกลางคืน มันนำผีมา\"", "\"If a gecko makes three sounds, something bad will happen.\" \"Don't sing while cooking.\"|\"ถ้าจิ้งจกทักสามครั้ง จะมีเรื่องไม่ดีเกิดขึ้น\" \"อย่าร้องเพลงตอนทำอาหาร\"", "Win always laughs and says, \"Grandma, those are just old stories!\"|วินหัวเราะเสมอและพูดว่า \"ยาย นั่นเป็นแค่เรื่องเก่าๆ\"", "One evening, Win was studying. He felt bored, so he started whistling. The wind blew outside.|เย็นวันหนึ่งวินกำลังอ่านหนังสือ รู้สึกเบื่อจึงเริ่มผิวปาก ข้างนอกลมพัด", "Suddenly, a gecko chirped three times on the ceiling. Then, the windows shook, and a strange cat screamed, \"MEOWWW!\"|ทันใดนั้นจิ้งจกร้องสามครั้งบนเพดาน แล้วหน้าต่างสั่น และแมวแปลกตัวหนึ่งร้อง \"เมี้ยวว\"", "Win stopped whistling and looked around. He smiled and thought, \"Grandma would say this is bad luck, but I don't believe it.\"|วินหยุดผิวปากและมองรอบๆ เขายิ้มและคิดว่า \"ยายคงว่านี่เป็นลางร้าย แต่ฉันไม่เชื่อ\"", "That night, Win went to sleep. There were three knocks at the door. Knock… Knock… Knock…|คืนนั้นวินเข้านอน มีเสียงเคาะประตูสามครั้ง ก๊อก ก๊อก ก๊อก", "Win suddenly sat up in bed. He looked at the door. No one was there.|วินลุกนั่งทันที มองไปที่ประตู ไม่มีใครอยู่", "He felt a bit scared but said to himself, \"It's only the wind,\" and went back to sleep.|เขารู้สึกกลัวเล็กน้อยแต่บอกตัวเองว่า \"แค่ลมเท่านั้น\" แล้วกลับไปนอน", "In the morning, Win went to school. On the way, a black cat crossed in front of him. He stopped for a second, then kept walking.|ตอนเช้าวินไปเรียน ระหว่างทางแมวดำเดินตัดหน้า เขาหยุดครู่หนึ่งแล้วเดินต่อ", "Suddenly, a motorbike came by very fast! Win jumped back quickly. He was okay.|ทันใดนั้นมอเตอร์ไซค์พุ่งมาเร็วมาก วินกระโดดถอยหลังทัน เขาปลอดภัย", "When he got home, Win told his grandma about what happened. She looked serious and said, \"Always be careful.\"|เมื่อถึงบ้านวินเล่าเรื่องให้ยายฟัง ยายทำหน้าจริงจังและพูดว่า \"ระวังตัวเสมอนะ\"", "Win just laughed and went to the kitchen to cook dinner. Win cooked kaeng som (spicy and sour fish curry)—his favorite food.|วินหัวเราะแล้วไปครัวทำอาหารเย็น เขาทำแกงส้ม อาหารโปรดของเขา", "While cooking, he sang a song and started whistling. Then, he whistled the tune while stirring the pot.|ขณะทำอาหารเขาร้องเพลงและผิวปาก แล้วผิวปากทำนองเพลงขณะคนหม้อ", "Suddenly, he knocked over the salt. It spilled everywhere. Win laughed and remembered his grandma's words:|ทันใดนั้นเขาทำเกลือหกเต็มไปหมด วินหัวเราะและนึกถึงคำของยาย", "\"Don't sing while cooking. You will marry an old person.\" \"If you spill salt, throw some over your shoulder.\" \"Never whistle at night.\"|\"อย่าร้องเพลงตอนทำอาหาร จะได้แต่งงานกับคนแก่\" \"ถ้าทำเกลือหก ให้โยนข้ามไหล่\" \"อย่าผิวปากตอนกลางคืน\"", "Just then, his phone buzzed. He got a LINE message from someone he didn't know. It said, \"PREPARE YOURSELF. The wedding is tonight.\"|ทันใดนั้นโทรศัพท์สั่น เขาได้ข้อความ LINE จากคนไม่รู้จัก ว่า \"เตรียมตัวให้พร้อม คืนนี้มีงานแต่งงาน\"", "Win felt nervous. His phone buzzed again. This time it was a call. He answered it slowly. \"Hello… Hello… Hellooooo...\" There was silence.|วินรู้สึกประหม่า โทรศัพท์สั่นอีก คราวนี้เป็นสายโทรเข้า เขารับช้าๆ \"ฮัลโหล...\" เงียบ", "Then, a loud, scary voice shouted, \"STOP SINGING!!!\" Win's heart beat fast. The lights flickered—then went out.|แล้วเสียงดังน่ากลัวตะโกนว่า \"หยุดร้องเพลง\" หัวใจวินเต้นแรง ไฟกะพริบแล้วดับ", "The End? Was it just a joke or a prank? A strange coincidence? Or… is something watching Win?|จบหรือยัง เป็นแค่เรื่องตลกหรือแกล้ง บังเอิญแปลกๆ หรือมีบางสิ่งเฝ้าดูวินอยู่ (ข้อคิด: ความเชื่อโชคลางเป็นเรื่องวัฒนธรรม ควรเปิดใจและระวังตัว)"];C[10].s="วินไม่เชื่อโชคลางของยาย (ห้ามผิวปากกลางคืน จิ้งจกทักสามครั้ง ห้ามร้องเพลงตอนทำอาหาร) แต่หลังเขาทำตามที่ยายห้ามก็เกิดเหตุแปลก ทั้งเสียงเคาะ แมวดำ มอเตอร์ไซค์เกือบชน ข้อความลึกลับ และไฟดับ จบแบบเปิดว่าบังเอิญหรือมีสิ่งลี้ลับ. Setting: นครศรีธรรมราช บ้านวิน Characters: วิน ยาย Conflict: ความเชื่อของคนต่างรุ่น Theme: ความเชื่อทางวัฒนธรรมและการระวังตัว";
