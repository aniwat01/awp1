C[11].l=["Thailand is a beautiful country with many rivers, mountains, and lakes. It is a hot and rainy country.|ไทยเป็นประเทศที่สวยงามมีแม่น้ำ ภูเขา และทะเลสาบมากมาย เป็นประเทศที่ร้อนและฝนตก", "In the warm and rainy climate of Thailand, farming is an important way of life, especially in the province of Phattalung.|ในภูมิอากาศอบอุ่นและฝนชุกของไทย การทำเกษตรเป็นวิถีชีวิตสำคัญ โดยเฉพาะที่จังหวัดพัทลุง", "Many people in Phattalung are farmers. They grow rice, fruits, and vegetables. They work very hard all year.|คนพัทลุงจำนวนมากเป็นชาวนา ปลูกข้าว ผลไม้ และผัก ทำงานหนักทั้งปี", "This story is about a farmer's son. His name was Jaran. 'Jaran' means 'strong' or 'brave,' but Jaran's life was not always easy.|เรื่องนี้เกี่ยวกับลูกชายชาวนาชื่อจรัญ \"จรัญ\" แปลว่าแข็งแรงหรือกล้าหาญ แต่ชีวิตของจรัญไม่ได้ง่ายเสมอไป", "There were many people in Jaran's family. He had five brothers and four sisters.|ครอบครัวจรัญมีคนมาก เขามีพี่น้องชายห้าคนและพี่น้องหญิงสี่คน", "But one of his sisters died when she was only two months old. One of his brothers drowned in a river during a storm.|แต่น้องสาวคนหนึ่งเสียชีวิตตอนอายุเพียงสองเดือน และพี่ชายคนหนึ่งจมน้ำตายในแม่น้ำระหว่างพายุ", "Jaran's family lived near a large river. It was a dangerous place because every year, during the rainy season, the river overflowed.|ครอบครัวจรัญอาศัยใกล้แม่น้ำใหญ่ เป็นที่อันตรายเพราะทุกปีในฤดูฝนแม่น้ำล้นตลิ่ง", "But the land was fertile, and the family depended on it for farming.|แต่ดินอุดมสมบูรณ์ และครอบครัวพึ่งพามันในการเพาะปลูก", "Jaran was happy on the farm. He had a lot of work to do, but he liked his work.|จรัญมีความสุขที่ไร่ เขามีงานมากแต่ชอบงานของเขา", "Because he was small and quick, he climbed coconut trees to gather coconuts. He took the buffaloes to the river to wash them.|เพราะตัวเล็กและคล่องแคล่ว เขาปีนต้นมะพร้าวเก็บมะพร้าว และพาควายไปล้างที่แม่น้ำ", "Jaran loved the river. He rode on the back of one of the buffaloes and swam in the cool water.|จรัญรักแม่น้ำ เขาขี่หลังควายและว่ายน้ำในน้ำเย็น", "One night, just after the family went to bed, Jaran heard a loud noise. It was like the sound of heavy rain hitting the roof.|คืนหนึ่ง หลังครอบครัวเข้านอนไม่นาน จรัญได้ยินเสียงดัง เหมือนเสียงฝนตกหนักกระทบหลังคา", "But there was no wind. The noise grew louder. Then his father cried, \"It's the river! The flood is coming! Quick! Get up!\"|แต่ไม่มีลม เสียงดังขึ้น แล้วพ่อตะโกนว่า \"แม่น้ำ น้ำท่วมมาแล้ว เร็ว ลุกขึ้น\"", "Jaran ran outside. In the darkness, he could see the water rushing toward their house. The river had overflowed.|จรัญวิ่งออกไปข้างนอก ในความมืดเขาเห็นน้ำไหลเชี่ยวมาทางบ้าน แม่น้ำล้นตลิ่งแล้ว", "He could hear the strong currents carrying tree branches and debris. The water level was rising fast.|เขาได้ยินกระแสน้ำแรงพัดกิ่งไม้และเศษซากมา ระดับน้ำสูงขึ้นเร็ว", "All his family were awake now. His father shouted, \"Get some things from the house! We have to leave now!\"|ทุกคนในครอบครัวตื่นแล้ว พ่อตะโกนว่า \"เอาของบางอย่างจากบ้าน เราต้องไปเดี๋ยวนี้\"", "Jaran ran back inside. He grabbed his clothes and a small bag.|จรัญวิ่งกลับเข้าบ้าน คว้าเสื้อผ้าและกระเป๋าใบเล็ก", "Outside, there was chaos. People were shouting, running through the muddy water, and calling out to each other.|ข้างนอกวุ่นวาย ผู้คนตะโกน วิ่งผ่านน้ำโคลน และเรียกกันและกัน", "The floodwaters rose quickly. Jaran felt terrified. He looked for his father and mother, but the water was rising fast. He couldn't see them.|น้ำท่วมสูงเร็ว จรัญหวาดกลัวมาก เขาหาพ่อแม่แต่น้ำสูงเร็วและมองไม่เห็นท่าน", "\"Father! Mother!\" Jaran called, but no one answered.|\"พ่อ แม่\" จรัญเรียกแต่ไม่มีใครตอบ", "Jaran had no choice but to run. Many people were moving towards higher ground, away from the rushing water.|จรัญไม่มีทางเลือกนอกจากวิ่ง ผู้คนมากมายกำลังไปยังที่สูงห่างจากน้ำเชี่ยว", "He couldn't see the road. He just ran. Several times, he slipped in the mud. His feet were heavy, and he struggled to keep moving.|เขามองไม่เห็นถนน ได้แต่วิ่ง หลายครั้งลื่นล้มในโคลน เท้าหนักและเขาดิ้นรนจะเคลื่อนที่ต่อ", "When he was too tired to run anymore, he found a high spot near a big tree. He climbed onto a thick branch and curled up, cold and afraid.|เมื่อเหนื่อยเกินจะวิ่ง เขาพบที่สูงใกล้ต้นไม้ใหญ่ ปีนขึ้นกิ่งใหญ่และขดตัว หนาวและหวาดกลัว", "He closed his eyes and listened to the sound of the raging water. Soon, he fell asleep, not knowing what tomorrow would bring.|เขาหลับตาและฟังเสียงน้ำคลั่ง ไม่นานก็หลับไป โดยไม่รู้ว่าพรุ่งนี้จะเป็นอย่างไร"];C[11].s="จรัญเป็นลูกชายชาวนาพัทลุงที่อาศัยใกล้แม่น้ำล้นตลิ่งทุกฤดูฝน แม้ดินอุดมสมบูรณ์ คืนหนึ่งน้ำท่วมใหญ่มาถึง ครอบครัวพลัดหลง จรัญวิ่งหนีน้ำโคลนขึ้นที่สูง ปีนต้นไม้และหลับไป ไม่รู้ว่าพรุ่งนี้เป็นอย่างไร. Setting: พัทลุง ริมแม่น้ำ กลางคืนฤดูฝน Characters: จรัญ พ่อแม่ ครอบครัว Conflict: เด็กสู้ภัยน้ำท่วมและพลัดหลงพ่อแม่ (external) Theme: ความกล้าหาญและการเอาตัวรอด";
const GP={"0": ["ฝึก: จำแนก Noun / Verb / Adjective", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) The theme is the <u>main</u> idea. main = <b>→ adjective</b><br>2) The plot <u>helps</u> organize stories. helps = <b>→ verb</b><br>3) <u>Setting</u> is time and place. Setting = <b>→ noun</b><br>4) Conflict can be <u>internal</u>. internal = <b>→ adjective</b><br><b>เคล็ดลับ:</b> หา verb ก่อน แล้วหา noun คำที่ขยาย noun คือ adjective"], "1": ["ฝึก: Simple Past + will", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) The farmer and his son (enter) the field. <b>→ entered</b><br>2) The young larks (know) they were in danger. <b>→ knew</b><br>3) Rice grains (fall) on their heads. <b>→ fell</b><br>4) \"We (lose) half of the crop,\" said the farmer. (อนาคต) <b>→ will lose</b><br><b>เคล็ดลับ:</b> เล่าเรื่องใช้ V2 พูดอนาคตใช้ will + V1 และหลัง did/did not ใช้ V1"], "2": ["ฝึก: Simple Past + คำเชื่อม", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) He stayed away ___ he was afraid. <b>→ because</b><br>2) Being alone was sad, ___ he made a plan. <b>→ so</b><br>3) ___ the fox finished speaking, an older fox stood up. <b>→ After</b><br>4) The fox (get) stuck in a trap. <b>→ got</b><br><b>เคล็ดลับ:</b> because บอกเหตุ, so บอกผล, but บอกความขัดแย้ง, after/when บอกลำดับเวลา"], "3": ["ฝึก: Simple Past ไม่ปกติ + will", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) The boy (eat) the apples. <b>→ ate</b><br>2) The boy (grow) up. <b>→ grew</b><br>3) The man (cut) the trunk to make a boat. <b>→ cut</b><br>4) \"You (have) some money,\" said the tree. (อนาคต) <b>→ will have</b><br><b>เคล็ดลับ:</b> cut ไม่เปลี่ยนรูป ใน V2 · ตัวอย่างอื่น: put→put, read→read (อ่านว่า เรด)"], "4": ["ฝึก: Superlatives", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) the (sad) family <b>→ saddest</b><br>2) the (colorful) clothes <b>→ most colorful</b><br>3) the (happy) person <b>→ happiest</b><br>4) the (bad) piece of land <b>→ worst</b><br><b>เคล็ดลับ:</b> คำสั้น +est, คำยาว most + adj, y→iest, ซ้ำพยัญชนะท้ายถ้าสั้น, ต้องมี the"], "5": ["ฝึก: Past Continuous", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) A rabbit (settle) down when a sound woke him. <b>→ was settling</b><br>2) The animals (run) toward a cliff. <b>→ were running</b><br>3) While he (nap), a coconut fell. <b>→ was napping</b><br>4) Many rabbits (scream) together. <b>→ were screaming</b><br><b>เคล็ดลับ:</b> was กับ I/he/she/it, were กับ you/we/they และพหูพจน์ · ตัวที่ถูกแทรกใช้ Simple Past"], "6": ["ฝึก: Past Continuous + Simple Past", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) As he (chop) the tree, he slipped. <b>→ was chopping</b><br>2) His ax (fly) out of his hand. <b>→ flew</b><br>3) The spirit (come) up with a gold ax. <b>→ came</b><br>4) \"I (find) your ax,\" said the spirit. (สัญญา) <b>→ will find</b><br><b>เคล็ดลับ:</b> while/as + was/were V-ing แล้วเหตุการณ์แทรกเป็น Simple Past"], "7": ["ฝึก: Simple Past ไม่ปกติ + Adjective", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) Rip (take) his dog into the forest. <b>→ took</b><br>2) Rip (hear) a voice calling him. <b>→ heard</b><br>3) Rip (fall) into a deep sleep. <b>→ fell</b><br>4) adjective ใน a <u>short, old</u> man คือ <b>→ short, old</b><br><b>เคล็ดลับ:</b> adjective ขยาย noun และเรียงหน้า noun · ท่อง V2: see→saw, find→found, begin→began"], "8": ["ฝึก: Adjective + Past Continuous", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) Jeremy (fly) over the desert when the engine broke. <b>→ was flying</b><br>2) an <u>elegant</u> man — elegant เป็น <b>→ adjective</b><br>3) The plane (crash) into the sand. <b>→ crashed</b><br>4) The sand was <u>soft</u>. soft = <b>→ adjective</b><br><b>เคล็ดลับ:</b> adjective อยู่หลัง be ได้ (The sand was soft) และหน้า noun ได้ (soft sand)"], "9": ["ฝึก: Simple Past + Superlative", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) The boy (prepare) himself for the race. <b>→ prepared</b><br>2) The little boy (feel) proud. <b>→ felt</b><br>3) The wise man (remain) calm. <b>→ remained</b><br>4) That is the (good) race you can run. <b>→ best</b><br><b>เคล็ดลับ:</b> good→best, bad→worst เป็นรูปพิเศษ ไม่ใช้ most/-est"], "10": ["ฝึก: Simple Future + Past", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) \"Something bad ___ happen.\" (อนาคต) <b>→ will</b><br>2) Win (laugh) and went to the kitchen. <b>→ laughed</b><br>3) Win (knock) over the salt. <b>→ knocked</b><br>4) Grandma is the (wise) person. <b>→ wisest</b><br><b>เคล็ดลับ:</b> will + V1 ไม่เติม s · ปฏิเสธ will not (won't)"], "11": ["ฝึก: Past Continuous + Simple Past", "<b>ฝึกจากประโยคในเรื่อง</b> (เฉลยท้ายบรรทัด)<br>1) The water level (rise) fast. <b>→ was rising</b><br>2) People (shout) and running. <b>→ were shouting</b><br>3) Jaran (grab) his clothes. <b>→ grabbed</b><br>4) He (hear) the strong currents. <b>→ heard</b><br><b>เคล็ดลับ:</b> บรรยายฉากที่กำลังเกิดใช้ was/were V-ing, เหตุการณ์ต่อเนื่องใช้ Simple Past"]};const QP={"0": [["Which is a noun?", ["theme", "internal", "happily", "climb"], 0], ["Which is a verb? 'The plot helps organize the story.'", ["helps", "plot", "story", "the"], 0], ["Which is an adjective?", ["universal", "setting", "plot", "conflict"], 0]], "1": [["Yesterday they ___ their nest.", ["left", "leave", "leaves", "leaving"], 0], ["The larks ___ afraid.", ["were", "was", "is", "be"], 0], ["Tomorrow we ___ the rice.", ["will harvest", "harvested", "harvests", "harvesting"], 0]], "2": [["He was afraid, ___ he stayed away.", ["so", "because", "although", "or"], 0], ["He ___ a plan.", ["came up with", "come up with", "comes up with", "coming up with"], 0], ["He did not ___ his tail.", ["see", "saw", "seen", "sees"], 0]], "3": [["The boy ___ up and left the tree.", ["grew", "grow", "grown", "grows"], 0], ["The man ___ down and rested.", ["sat", "sit", "sitted", "sits"], 0], ["They ___ some money soon. (future)", ["will have", "had", "has", "have had"], 0]], "4": [["She is the ___ girl in class. (tall)", ["tallest", "most tall", "taller", "tall"], 0], ["It was the ___ valuable treasure.", ["most", "more", "much", "very"], 0], ["He is the ___ student. (good)", ["best", "goodest", "most good", "better"], 0]], "5": [["Rabbits ___ behind him.", ["were running", "was running", "ran is", "runs"], 0], ["While I ___, he called.", ["was cooking", "cooked", "cook", "were cooking"], 0], ["They ___ not sleeping.", ["were", "was", "are", "be"], 0]], "6": [["He ___ the tree when his ax slipped.", ["was cutting", "cut is", "cuts", "were cutting"], 0], ["The spirit ___ the ax up.", ["brought", "bring", "brings", "bringing"], 0], ["I ___ you the truth. (will)", ["will tell", "told", "tells", "telling"], 0]], "7": [["Rip ___ at the strange men.", ["looked", "look", "looks", "looking"], 0], ["Rip ___ a long beard.", ["had", "have", "has", "having"], 0], ["Which is an adjective?", ["grizzled", "barrel", "walk", "village"], 0]], "8": [["Jeremy ___ thirsty.", ["was", "were", "is", "be"], 0], ["The plane ___ into the sand.", ["crashed", "crash", "crashes", "crashing"], 0], ["Which is an adjective?", ["luxurious", "hotel", "knock", "desert"], 0]], "9": [["The boy ___ first.", ["finished", "finish", "finishes", "finishing"], 0], ["The crowd ___ the boy.", ["cheered", "cheer", "cheers", "cheering"], 0], ["He ran the ___ race of his life. (good)", ["best", "goodest", "most good", "better"], 0]], "10": [["Win ___ at the door.", ["looked", "look", "looks", "looking"], 0], ["Grandma said bad luck ___ come.", ["will", "did", "was", "does"], 0], ["She ___ serious.", ["looked", "look", "looks", "looking"], 0]], "11": [["The river ___ over.", ["overflowed", "overflow", "overflows", "overflowing"], 0], ["Jaran ___ his clothes.", ["grabbed", "grab", "grabs", "grabbing"], 0], ["People ___ in the mud.", ["were running", "was running", "ran is", "runs"], 0]]};for(const k in GP){C[k].G.push(GP[k]);C[k].q.push(...QP[k])}
const EXP={"'I stood high up on a small platform.' sentence นี้บอกอะไร?": "ประโยคบอกสถานที่ (บนแท่นสูงเล็กๆ) จึงเป็น Setting = เวลา+สถานที่ ส่วน Theme คือสารของเรื่อง, Climax คือจุดตึงเครียดสุด, Moral คือข้อคิด", "The most exciting part of a story is the ___.": "Climax คือจุดสูงสุดของเรื่องที่ตึงเครียดที่สุด ก่อนเข้าสู่ falling action และ resolution ส่วน introduction คือเปิดเรื่อง", "Conflict ที่เกิดภายในใจตัวละครเรียกว่า": "internal = ภายใน ความขัดแย้งในใจ (เช่น กลัว ลังเล) ส่วน external คือกับคนอื่นหรือธรรมชาติ", "'Moral of the story' means": "moral = บทเรียน/ข้อคิดของเรื่อง ตรงกับ lesson ไม่ใช่ชื่อเรื่อง สถานที่ หรือตอนจบ", "The time and place of a story is the ___.": "เวลา+สถานที่ของเรื่อง = Setting ส่วน plot คือลำดับเหตุการณ์ conflict คือปัญหา theme คือสารสำคัญ", "The most exciting part is the ___.": "จุดที่ตื่นเต้นที่สุด = climax", "A struggle inside a character is ___ conflict.": "inside a character = ภายในตัวละคร จึงเป็น internal conflict", "The main message of a story is the ___.": "main message = สารหลัก คือ theme", "Which word is an adjective? 'The main idea is clear.'": "adjective ขยาย noun: main ขยาย idea (the main idea) ส่วน idea เป็น noun, is เป็น verb", "Which word is a verb? 'The lark built a nest.'": "built = V2 ของ build เป็นการกระทำ ส่วน lark และ nest เป็น noun, the/a เป็น article", "Which is a noun?": "theme = สิ่งที่เป็นชื่อ (แนวคิด) จึงเป็น noun ส่วน internal เป็น adjective, happily เป็น adverb, climb เป็น verb", "Which is a verb? 'The plot helps organize the story.'": "helps คือกริยาแท้ของประโยค (plot ทำหน้าที่ช่วย) ส่วน plot, story เป็น noun", "Which is an adjective?": "universal (เป็นสากล) บอกลักษณะของ noun จึงเป็น adjective ส่วน setting, plot, conflict เป็น noun", "Yesterday, Sarah ___ to the store.": "yesterday = อดีต จึงใช้ V2 ของ go คือ went (goes ปัจจุบัน, going ไม่ครบรูป)", "Rice grains ___ on the young larks' heads.": "เหตุการณ์ในอดีต fall→fell (ไม่ปกติ) ส่วน felt คือ V2 ของ feel คนละคำ", "The farmer said, 'We must ___ in our neighbors.'  'harvest' แปลว่า": "harvest = เก็บเกี่ยว (พืชผล) ในเรื่องคือเกี่ยวข้าว ไม่ใช่ปลูก รดน้ำ หรือขาย", "'ripe' means": "ripe = สุก พร้อมเก็บเกี่ยว ตรงกับข้าวที่สุกสีทองในเรื่อง", "Why did the larks leave the nest?": "เมื่อชาวนารอเพื่อนบ้านไม่ได้ เขาตัดสินใจเกี่ยวเอง แม่นกจึงบอกให้ย้ายเพราะการลงมือเองหมายถึงจะไม่ล่าช้า", "'Self-help is the best help' means ___.": "Self-help = ช่วยตัวเอง จึงหมายถึงพึ่งตนเอง ตรงกับข้อคิดของเรื่อง", "The farmer and his son ___ the field. (enter)": "เล่าเรื่องในอดีต + enter เป็นกริยาปกติ จึงเติม -ed = entered", "The mother lark did not ___ at first.": "หลัง did not ต้องใช้ V1 เสมอ (leave) ห้ามใช้ left", "Who finally decided to harvest the rice by himself?": "ชาวนาบอกว่า 'Tomorrow we must set to work ourselves' ผู้ตัดสินใจคือชาวนา", "Yesterday, the farmer ___ his neighbors.": "yesterday = อดีต call เป็นกริยาปกติ จึงเป็น called", "They did not ___ at first.": "did not + V1 = leave", "Yesterday they ___ their nest.": "yesterday = อดีต leave→left (ไม่ปกติ)", "The larks ___ afraid.": "larks เป็นพหูพจน์ (they) ในอดีตใช้ were (was ใช้กับเอกพจน์)", "Tomorrow we ___ the rice.": "tomorrow = อนาคต ใช้ will + V1 = will harvest", "After the fox ___ speaking, an older fox stood up.": "after + Past Simple ทั้งสองส่วนเป็นอดีต จึงเป็น finished (เติม -ed)", "The moral of the story is about ___.": "เรื่องสอนให้ยอมรับตัวเองและไม่ให้คนอื่นกำหนดชีวิต = self-acceptance", "'pointless' ใกล้เคียงกับ": "pointless (ไร้จุดหมาย ไร้ประโยชน์) = useless ส่วน useful ตรงข้าม", "Antonym of 'confidence'": "confidence = ความมั่นใจ ตรงข้ามคือ doubt (ความสงสัย ไม่มั่นใจ)", "The foxes laughed because the fox ___.": "จิ้งจอกตัวอื่นหัวเราะเมื่อมันหันหลัง เพราะไม่มีหาง", "He stayed away ___ he was afraid they would laugh at him.": "ช่องว่างตามด้วยเหตุผล (กลัวถูกหัวเราะ) ใช้ because; so ใช้นำผล, but ใช้ขัดแย้ง", "Being alone was sad, ___ he came up with a plan.": "ก่อนหน้าเป็นเหตุ (เหงา) หลังเป็นผล (คิดแผน) ใช้ so", "Who asked the fox to turn around?": "จิ้งจอกแก่ลุกขึ้นแล้วขอให้หันหลัง", "Why did the fox want the others to cut off their tails?": "เขาพยายามโน้มน้าวให้ตัดหางเพราะตัวเองไม่มีหาง จึงอยากให้ทุกตัวเหมือนกัน", "The fox stayed away ___ he was afraid.": "บอกเหตุผล = because", "The fox ___ a trap.": "got stuck in a trap = ติดกับดัก (get→got อดีต) ส่วนตัวเลือกอื่นเป็นปัจจุบัน/ไม่ครบรูป", "He was afraid, ___ he stayed away.": "กลัวคือเหตุ หลบคือผล = so", "He ___ a plan.": "came up with a plan = คิดแผน (come up with → อดีต came up with)", "He did not ___ his tail.": "did not + V1 = see (ห้ามใช้ saw หลัง did not)", "He ___ to the treetop and ate the apples.": "เล่าอดีต climb เป็นกริยาปกติ = climbed", "He didn't ___ back for a long time.": "didn't + V1 = come (ไม่ใช่ came)", "The little boy ___ up.": "grow→grew ไม่ปกติ (เติม -ed ไม่ได้)", "Synonym of 'huge'": "huge = ใหญ่มาก synonym คือ giant ส่วน tiny/thin/weak ไม่ใช่", "The tree gave the boy everything because of ___ love.": "ต้นไม้ให้ทุกอย่างโดยไม่หวังสิ่งตอบแทน = unconditional love (รักไม่มีเงื่อนไข)", "He ___ the apples and took a nap.": "eat→ate เป็น V2 ไม่ปกติ ใช้คู่ took (V2 ของ take)", "The man ___ the trunk to make a boat. (cut)": "cut→cut ไม่เปลี่ยนรูปใน V2 (ห้ามเติม -ted)", "At the end, the old man needed ___.": "ชายแก่บอกว่าแค่ต้องการที่พักผ่อน ต้นไม้เป็นรากไว้ให้นั่ง", "In the moral, the tree is like our ___.": "ข้อคิดบอกว่าต้นไม้เปรียบเหมือนพ่อแม่ ที่ให้ทุกอย่างเพื่อให้เรามีความสุข", "The boy ___ the apples. (eat)": "eat→ate = เป็น V2", "The tree said, 'You ___ some money.'": "คำพูดของต้นไม้เกี่ยวกับอนาคต ใช้ will + V1", "The boy ___ up and left the tree.": "grow→grew (ไม่ปกติ) คู่กับ left", "The man ___ down and rested.": "sit→sat (ไม่ปกติ) ไม่ใช่ sitted", "They ___ some money soon. (future)": "soon บอกอนาคต ใช้ will have"};
Object.assign(EXP,{"They had the ___ garden anyone had ever seen. (beautiful)": "beautiful เป็นคำยาว 3 พยางค์ ระดับสูงสุดใช้ the most + adj = the most beautiful (ห้ามเติม -est)", "She is the ___ girl in class. (happy)": "happy เป็นคำสั้น ลงท้าย y จึงเปลี่ยน y→i แล้วเติม -est = the happiest", "bad → ?": "bad เป็นรูปไม่ปกติ: bad – worse – worst ระดับสูงสุดคือ worst", "Closest meaning of 'cheerful'": "cheerful = ร่าเริง ใกล้เคียง joyful ส่วน sad / sorrowful / gloomy เป็นความรู้สึกหม่นหมอง (ตรงข้าม)", "She is the ___ student in class. (tall)": "tall เป็นคำสั้น 1 พยางค์ + the ... → เติม -est = tallest", "Mavuto picked the ___ piece of land. (bad)": "ระดับสูงสุดของ bad คือ worst (the worst = แย่ที่สุด) ตรงกับเรื่องที่ Mavuto เลือกที่ดินที่แย่ที่สุด", "It was the ___ land near the house. (dry)": "dry ลงท้าย y จึงเปลี่ยน y→i แล้วเติม -est = driest (ไม่ใช่ dryest)", "The family was the ___ in the village. (sad)": "sad ลงท้าย พยัญชนะ-สระ-พยัญชนะ ต้องซ้ำ d ก่อนเติม -est = saddest", "Why were the family unhappy even though they were rich?": "ในเรื่องครอบครัวมีเงินและทรัพย์สินมากที่สุดแต่ไม่มีความสุข จึงสื่อว่าเงินและทรัพย์สินทำให้มีความสุขไม่ได้ ส่วนตัวเลือกอื่นขัดกับเนื้อเรื่อง (พวกเขาร่ำรวย)", "It was the ___ garden anyone had seen.": "beautiful ยาว 3 พยางค์ ใช้ the most beautiful; beautifullest / beautifuler ไม่มีในภาษาอังกฤษ และ more ใช้เทียบ 2 สิ่ง (ต้องมี than)", "The family became the ___ in the village. (happy)": "ใช้ the + superlative และ happy เปลี่ยน y→i = the happiest", "She is the ___ girl in class. (tall)": "ระดับสูงสุดของคำสั้น tall คือ tallest (the tallest girl = สูงที่สุด)", "It was the ___ valuable treasure.": "valuable เป็นคำยาว ต้องมี most นำหน้าเพื่อทำ superlative = the most valuable (more เทียบ 2 สิ่ง, much/very ไม่ใช่ superlative)", "He is the ___ student. (good)": "good เป็นรูปไม่ปกติ: good – better – best ระดับสูงสุดคือ best", "I ___ my book when the teacher called my name.": "reading เป็นการกระทำที่กำลังดำเนินอยู่แล้วถูกขัดจังหวะด้วย called (Past Simple) จึงใช้ Past Progressive = was reading", "They ___ playing when their parents arrived.": "They เป็นพหูพจน์ Past Progressive ใช้ were + V-ing (was ใช้กับ I/he/she/it)", "The sound was 'nothing but a falling ___'.": "ในเรื่องสิงโตเขย่าต้นไม้จนมะพร้าวหล่น แล้วบอกว่าเสียงนั้นคือมะพร้าวหล่น = coconut", "The lion shook the tree and a ___ fell.": "สิงโตเขย่าต้นมะพร้าวจนผลมะพร้าว (coconut) หล่นลงมา ไม่ใช่ดินถล่ม (landslide) ซึ่งเป็นสิ่งที่กระต่ายเข้าใจผิด", "While the rabbit ___, a sound woke him.": "While + การกระทำที่กำลังเกิดอยู่ในอดีต ใช้ was + V-ing = was sleeping (rabbit เป็นเอกพจน์)", "A rabbit ___ under a coconut tree when a sound woke him.": "การกระทำที่ดำเนินอยู่ (napping) ถูกขัดจังหวะด้วย woke (Past Simple) จึงใช้ was napping (A rabbit เอกพจน์)", "The animals ___ toward a cliff when the lion stopped them.": "The animals เป็นพหูพจน์ กำลังวิ่งอยู่ก่อนถูกสิงโตหยุด ใช้ were running (was ใช้กับเอกพจน์)", "While the rabbit ___, a coconut fell. (sleep)": "ใช้ was sleeping กับ rabbit (เอกพจน์) ส่วน were sleeping ใช้กับพหูพจน์", "What did the rabbit really hear?": "สิงโตพิสูจน์แล้วว่าเสียงดังที่กระต่ายได้ยินคือมะพร้าวหล่น (a falling coconut) ไม่ใช่ดินถล่ม", "The lion ___ when the rabbit arrived. (rest)": "การกระทำที่กำลังเกิดอยู่ขณะอีกเหตุการณ์เกิดขึ้น (arrived) ใช้ Past Progressive: The lion เอกพจน์ = was resting", "Many animals ___ toward the cliff.": "Many animals เป็นพหูพจน์ ใช้ were + V-ing = were rushing (was rushing ไม่ถูกคู่กับพหูพจน์; rushed is / rush are ผิดรูป)", "Rabbits ___ behind him.": "ในเรื่อง 'rabbits ... were running behind him' Rabbits เป็นพหูพจน์ จึงใช้ were running", "While I ___, he called.": "While + การกระทำที่กำลังเกิดอยู่ และ I ใช้กับ was = was cooking", "They ___ not sleeping.": "They + not + V-ing ในอดีตใช้ were not sleeping (be ต้องเป็น were ให้ตรงกับ They)", "As he ___ the tree, he slipped.": "การกระทำที่กำลังทำอยู่ (chopping) ถูกขัดจังหวะด้วย slipped (Past Simple) ใช้ was chopping ตามเรื่อง 'As he was chopping at the tree, he suddenly slipped'", "'honesty' ตรงข้ามกับ": "honesty = ความซื่อสัตย์ ตรงข้ามคือ deceit (การหลอกลวง) ส่วน truth ใกล้เคียงกัน ไม่ใช่ตรงข้าม", "ข้อใดแปลว่าโลภ": "greedy = โลภ (เพื่อนบ้านโกหกว่าขวานทองเป็นของตน) ส่วน poor = จน, honest = ซื่อสัตย์, brave = กล้าหาญ", "While the woodcutter ___ the tree, his axe slipped.": "While + เหตุการณ์ที่กำลังดำเนินในอดีต (slipped เป็นอดีต) ใช้ was cutting; is cutting เป็นปัจจุบัน และ was cut เป็น passive ไม่เหมาะกับคนตัดไม้", "He got gold and silver because he was ___.": "วิญญาณเห็นว่าชายตัดฟืนซื่อสัตย์ (honest) จึงให้ขวานทองและเงินเป็นรางวัล", "The woodcutter got all three axes because he was ___.": "เขาตอบตรงๆ ว่าขวานทองและเงินไม่ใช่ของตน วิญญาณจึงเห็นว่าเขาซื่อสัตย์ (honest) และมอบให้ทั้งสามเล่ม", "While the woodcutter ___ the tree, his ax slipped.": "ต้องการ Past Progressive หลัง while = was chopping (ไม่ใช่ chopped / chops)", "'deceitful' is closest to ___.": "deceitful = หลอกลวง ใกล้เคียง dishonest (ไม่ซื่อสัตย์) ตรงตามที่วิญญาณพูดกับเพื่อนบ้านที่โกหก", "What did the greedy neighbor lose?": "ท้ายเรื่องบอกว่าเพื่อนบ้านโลภไม่ได้ขวานทองและยังสูญเสียขวานของตัวเอง (his own ax) ด้วย", "While he ___ wood, the ax slipped.": "While + กำลังทำอยู่ในอดีต ใช้ was + V-ing (he เอกพจน์) = was chopping", "The spirit said, 'I ___ your ax.'": "คำพูดเรื่องที่จะทำในอนาคต ใช้ will + V1 = will find (ตามเรื่อง 'I will find your ax for you')", "He ___ the tree when his ax slipped.": "การกระทำที่กำลังเกิดอยู่ถูกขัดจังหวะด้วย slipped ใช้ was cutting (cut is / were cutting ผิดรูปหรือผิดประธาน)", "The spirit ___ the ax up.": "เล่าอดีต bring เป็นกริยาไม่ปกติ: bring → brought (ไม่เติม -ed)", "I ___ you the truth. (will)": "ในวงเล็บบอก will ต้องตามด้วย V1 = will tell", "Rip ___ down and began daydreaming.": "ตามเรื่อง 'he lay down' lie (นอนลง) → lay (V2) ส่วน laid คือ V2 ของ lay (วาง) และ lied คือ โกหก", "Suddenly he ___ a voice.": "เหตุการณ์อดีต hear เป็นกริยาไม่ปกติ: hear → heard", "Rip's dog was named ___.": "ในเรื่องบอกว่า Rip's constant companion was his dog, named Wolf", "Rip Van Winkle ___ up twenty years later.": "twenty years later เป็นอดีต wake → woke (V2 ไม่ปกติ)", "Antonym of 'lazy'": "lazy = ขี้เกียจ ตรงข้ามคือ hard-working (ขยัน) ส่วน idle ความหมายเหมือน lazy", "The only problem with Rip was that he was ___.": "ตามเรื่อง ปัญหาเดียวของ Rip คือเขา very lazy (ขี้เกียจ) ทำให้ฟาร์มรกร้าง", "Who was Rip's dog?": "สุนัขของ Rip ชื่อ Wolf เขาไปไหนก็พาไปด้วยเสมอ", "Rip ___ his dog and walked into the forest.": "อดีต take เป็นกริยาไม่ปกติ: take → took", "Rip ___ at the strange men.": "เล่าอดีต look เป็นกริยาปกติ เติม -ed = looked", "Rip ___ a long beard.": "ตอนตื่นมาเคราของ Rip ยาวและขาวแล้ว have → had (V2 ไม่ปกติ)", "Jeremy ___ out of his plane.": "เล่าอดีต climb เป็นกริยาปกติ เติม -ed = climbed (ตามเรื่อง 'Jeremy climbed out of his plane')", "He didn't ___ where he was going.": "หลัง didn't ต้องใช้ V1 เสมอ = know (ห้ามใช้ knew / known)", "The man in the desert wanted to sell ___.": "ชายบนอูฐอยากขายเนคไท (ties) ให้เจเรมีที่กำลังขาดน้ำ ไม่ใช่น้ำหรืออาหาร", "Synonym of 'elegant'": "elegant = สง่างาม ภูมิฐาน ใกล้เคียง stylish (ทันสมัยมีสไตล์) ส่วน silly / angry / tired ไม่เกี่ยวข้อง", "Jeremy went on his knees because he needed ___.": "เจเรมีกระหายน้ำมากและต้องการน้ำเพื่อรอดชีวิต เมื่อเห็นโรงแรมจึงคุกเข่าขอบคุณ เพราะหวังว่าจะได้น้ำ", "The engine of the plane ___ down suddenly.": "เล่าอดีต break down → broke down (V2 ไม่ปกติ)", "The man on the camel wanted to sell ___.": "ชายบนอูฐเปิดกระเป๋าและเสนอขายเนคไท (ties) หลายแบบ ทั้งที่ไม่มีน้ำ", "Why couldn't Jeremy enter the hotel?": "คนเฝ้าประตูบอกว่า you can't come in here without a tie จึงเข้าไม่ได้เพราะไม่มีเนคไท", "Jeremy ___ over the desert when the engine broke down.": "กำลังบินอยู่ถูกขัดจังหวะด้วย broke down (Past Simple) จึงใช้ Past Progressive = was flying", "Which is an adjective? 'He met an elegant man.'": "adjective ขยายคำนาม elegant ขยาย man ส่วน met เป็นกริยา, man เป็นนาม, an เป็นคำนำหน้านาม (article)", "Jeremy ___ thirsty.": "Jeremy เป็นเอกพจน์ อดีตของ be ใช้ was (ตามเรื่อง he was very very thirsty)", "The plane ___ into the sand.": "เล่าอดีต crash เป็นกริยาปกติ เติม -ed = crashed", "The little boy ___ proud and important.": "feel → felt (V2) ส่วน fell คือ V2 ของ fall (ล้ม) ซึ่งความหมายไม่เข้ากัน", "The boy ___ the first race.": "อดีต win เป็นกริยาไม่ปกติ: win → won", "'ecstatic' หมายถึง": "ecstatic = ปลื้มปีติ มีความสุขล้นหลาม = very happy", "Antonym of 'proud'": "proud = ภูมิใจ ตรงข้ามคือ ashamed (อับอาย) ส่วน happy / strong / fast ไม่ใช่ตรงข้าม", "The boy learned success means ___.": "ผู้เฒ่าสอนว่าความสำเร็จคือการเข้าเส้นชัยด้วยกัน (finishing together) ไม่ใช่ชนะคนเดียว", "'ecstatic' means ___.": "ecstatic = ดีใจมาก ปลื้มปีติ = very happy", "Who did the wise man bring for the third race?": "ในการแข่งครั้งที่ 3 ผู้เฒ่านำหญิงชราที่อ่อนแอและชายตาบอดมาเป็นคู่แข่ง (a frail elderly lady and a blind man)", "The little boy ___ proud. (feel)": "feel เป็นกริยาไม่ปกติ: feel → felt (feeled ผิด)", "The crowd ___ to watch the race.": "เล่าอดีต gather เป็นกริยาปกติ เติม -ed = gathered (ตามเรื่อง 'a large crowd gathered')", "The boy ___ first.": "เล่าอดีต finish เป็นกริยาปกติ เติม -ed = finished", "The crowd ___ the boy.": "เล่าอดีต cheer + -ed = cheered (ตามเรื่อง 'cheered and waved at the boy')", "He ran the ___ race of his life. (good)": "good เป็นรูปไม่ปกติ: good – better – best และมี the นำหน้าจึงเป็น superlative = best", "Win ___ studying when the wind blew.": "Win กำลังเรียนอยู่ (Past Progressive) ถูกขัดจังหวะด้วย blew (Past Simple) ใช้ was studying (Win เอกพจน์)", "He felt bored, ___ he started whistling.": "felt bored เป็นเหตุ started whistling เป็นผล ใช้ so (but ใช้ขัดแย้ง, because นำเหตุ)", "Superstition คือ": "superstition = ความเชื่อโชคลาง เช่น ห้ามผิวปากตอนกลางคืน", "Grandma is the ___ person in the house. (wise)": "wise ลงท้าย e อยู่แล้ว ทำ superlative เติม -st = the wisest", "If a gecko makes three sounds, ___.": "ตามความเชื่อของยาย 'If a gecko makes three sounds, something bad will happen'", "Win ___ at the door when he heard knocks.": "หลัง heard knocks Win มองไปที่ประตู เล่าอดีต look เติม -ed = looked (at the door)", "'coincidence' means ___.": "coincidence = เรื่องบังเอิญ เหตุการณ์ที่เกิดขึ้นพร้อมกันโดยบังเอิญ (events happening by chance)", "If the gecko sounds three times, something bad ___ happen.": "ความเชื่อว่าสิ่งไม่ดีจะเกิดในอนาคต ใช้ will + V1 = will happen", "Win ___ at the door.": "เล่าอดีต look เป็นกริยาปกติ เติม -ed = looked", "Grandma said bad luck ___ come.": "บอกสิ่งที่คาดว่าจะเกิดขึ้น ใช้ will + V1 = will come (was come / does come ใช้ไม่ได้)", "She ___ serious.": "look + adjective = ดูเหมือน (ตามเรื่อง 'She looked serious') อดีตจึงเป็น looked", "The land was ___, so the family farmed there.": "ตามเรื่อง 'the land was fertile' (ดินอุดมสมบูรณ์) ครอบครัวจึงทำฟาร์มที่นั่น ส่วน muddy / terrified / rushing ไม่เข้าความหมาย", "People ran in ___ as the water rose.": "chaos = ความวุ่นวายโกลาหล ตรงกับ 'Outside, there was chaos' ส่วน branches / debris / paws เป็นสิ่งของ", "He took the buffaloes and ___ in the cool water. (swim)": "swim เป็นกริยาไม่ปกติ: swim → swam (V2) ส่วน swum เป็น V3", "Synonym of 'terrified'": "terrified = หวาดกลัวมาก = very scared", "Broken pieces after a flood are ___.": "debris = เศษซากที่แตกหักหลังน้ำท่วม ส่วน chaos = ความวุ่นวาย, fertile = อุดมสมบูรณ์, branches = กิ่งไม้", "Jaran's family lived near a ___ river.": "ตามเรื่อง 'Jaran's family lived near a large river' (แม่น้ำใหญ่ที่ล้นตลิ่งทุกปี)", "Where did Jaran sleep?": "ท้ายเรื่องจรัญปีนขึ้นกิ่งไม้หนาที่ต้นไม้ใหญ่ แล้วหลับไป (on a tree branch)", "People ___ and running through the water.": "People เป็นพหูพจน์ กำลังทำอยู่ในอดีต ใช้ were shouting (Past Progressive)", "The water level ___ fast.": "The water level เป็นเอกพจน์ กำลังสูงขึ้นในอดีต ใช้ was rising ตามเรื่อง 'The water level was rising fast'", "The river ___ over.": "เล่าอดีต overflow เป็นกริยาปกติ เติม -ed = overflowed (ตามเรื่อง 'The river had overflowed')", "Jaran ___ his clothes.": "grab ลงท้าย CVC ซ้ำ b แล้วเติม -ed = grabbed (ตามเรื่อง 'He grabbed his clothes and a small bag')", "People ___ in the mud.": "People เป็นพหูพจน์ ตามเรื่อง 'running through the muddy water' ใช้ Past Progressive = were running", "Grandma is the ___ person. (wise)": "wise ลงท้าย e อยู่แล้ว ทำ superlative เติม -st = the wisest (ไม่ใช่ most wise)"});
const GD={"1": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Simple Past Tense", "<b>ใช้เมื่อ:</b> เหตุการณ์ที่เริ่มและจบแล้วในอดีต (คู่มือหน้า 25: started in the past and ended in the past) มักมีคำบอกเวลา เช่น yesterday, last night, a few days later<br><b>1) Be-verb:</b> is/am → <b>was</b>, are → <b>were</b> (I/he/she/it/เอกพจน์ = was; you/we/they/พหูพจน์ = were)<br>เช่น <i>The rice was so ripe.</i> ปฏิเสธ was not (wasn't) / were not (weren't)<br><b>2) กริยาปกติ (regular):</b> V1 + -ed เช่น call→called<br>• ลงท้าย e → เติม d: love→loved<br>• พยัญชนะ+y → y เป็น i + ed: try→tried<br>• สั้น CVC → ซ้ำตัวท้าย: stop→stopped, grab→grabbed<br><b>3) กริยาไม่ปกติ (irregular):</b> ต้องจำ เช่น make→made, go→went, think→thought, fall→fell, fly→flew, leave→left<br><b>4) ปฏิเสธ/คำถาม:</b> ใช้ did/did not + <u>V1 เสมอ</u> (ไม่ใช้ V2 ซ้ำ) เช่น <i>They did not leave. Did they leave?</i><br><b>ตัวอย่างจากเรื่อง:</b> A little bird called a lark <u>made</u> her nest (irregular) / They <u>tried</u> out their wings and <u>flew</u> away.<br><b>ข้อผิดที่พบบ่อย:</b> ❌ They did not left ✅ did not leave &nbsp; ❌ fall → falled ✅ fell &nbsp; ❌ fell กับ felt สับสน (fell = ตก, felt = รู้สึก)<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>1) Yesterday, Sarah ___ (go) to the store → <b>went</b> (irregular, yesterday=อดีต)<br>2) Rice grains ___ (fall) on their heads → <b>fell</b><br>3) They ___ out their wings and ___ away → <b>tried / flew</b></details>"]], "2": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Simple Past ในการเล่าเรื่อง + Sequence words", "<b>การเล่าเรื่อง (narration)</b> ใช้ Simple Past ต่อเนื่องทั้งเรื่อง: got stuck → escaped → stayed away → came up with → gathered → stood up → turned around<br><b>คำเรียงลำดับ:</b> first / then / after (that) / when / finally / later — ตามด้วยประโยคอดีต<br>• <i>After the fox <u>finished</u> speaking, an older fox <u>stood</u> up.</i> (after + Past Simple ทั้งสองส่วน)<br>• <i>When the fox turned around, the others started laughing.</i><br><b>คำเชื่อมเหตุผล:</b> because = เพราะ (นำเหตุ) / so = ดังนั้น (นำผล) / but = แต่ (ขัดแย้ง)<br>• He stayed away <b>because</b> he was afraid. • He was afraid, <b>so</b> he stayed away.<br><b>กริยาไม่ปกติในเรื่อง:</b> get→got, come→came, leave→left, stand→stood, say→said, tell→told, speak→spoke<br><b>ข้อควรระวัง:</b> couldn't / wasn't / didn't = รูปปฏิเสธอดีต ➜ couldn't run (ตามด้วย V1)<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>After the fox ___ (finish) speaking → <b>finished</b><br>He ___ (come) up with a plan → <b>came</b><br>He was afraid, ___ he stayed away → <b>so</b></details>"]], "3": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Nouns / Adjectives / Verbs + Simple Past (Regular vs Irregular)", "<b>จำแนกชนิดคำ (Activity 1 ในคู่มือ):</b><br>• <b>Noun</b> ชื่อคน สัตว์ สิ่งของ: boy, tree, apples, money, house, trunk, roots, branches<br>• <b>Adjective</b> ขยายนาม: huge, little, happy, sad, lonely, young, excited<br>• <b>Verb</b> การกระทำ: climbed, played, loved, asked, chopped, grabbed<br><b>Regular (+ed):</b> climb→climbed, play→played, love→loved, ask→asked, chop→chopped (ซ้ำ p), grab→grabbed (ซ้ำ b), return→returned, offer→offered<br><b>Irregular (ต้องจำ):</b> eat→ate, take→took, leave→left, cut→cut (ไม่เปลี่ยน), sit→sat, feel→felt, grow→grew, come→came, give→gave, have→had, say→said<br><b>เคล็ดลับ:</b> กริยาที่ V1=V2=V3 ได้แก่ cut, put, hit, let, hurt, set<br><b>ตัวอย่างจาก Activity 4:</b> The boy <u>took</u> everything the tree had. / The old man <u>sat</u> on the tree's roots.<br><b>ข้อผิดที่พบบ่อย:</b> ❌ eated, sitted, cutted ✅ ate, sat, cut &nbsp; ❌ He did not came back ✅ did not come back (หลัง did not ใช้ V1)<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>The boy ___ (take) everything → <b>took</b><br>The man ___ (cut) the branches → <b>cut</b><br>The tree ___ (feel) sad → <b>felt</b></details>"]], "4": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Superlative Adjectives (ขั้นสูงสุด)", "<b>ใช้เมื่อ:</b> เปรียบเทียบ 3 สิ่งขึ้นไป ได้ \"ที่สุด\" ต้องมี <b>the</b> นำหน้าเสมอ<br><b>กฎ 1: คำสั้น (1 พยางค์)</b> → the + adj + <b>-est</b>: tall→the tallest, dry→the <u>driest</u> (y→i), full→the fullest<br>• ลงท้าย e → เติม st: wise→wisest, nice→nicest<br>• CVC ซ้ำพยัญชนะ: sad→the <u>saddest</u>, big→biggest<br><b>กฎ 2: คำ 2 พยางค์ลงท้าย y</b> → y เป็น i + est: happy→happiest, lively→liveliest, lovely→loveliest, crazy→craziest<br><b>กฎ 3: คำยาว (2+ พยางค์/3 พยางค์ขึ้นไป)</b> → the <b>most</b> + adj: the most beautiful, the most colorful, the most expensive, the most valuable, the most boring (ห้ามใช้ -est)<br><b>กฎ 4: ไม่ปกติ:</b> good→<b>best</b>, bad→<b>worst</b>, far→farthest<br><b>ตัวอย่างจากเรื่อง:</b> the wealthiest people / the saddest family / the worst piece of land / the most beautiful garden<br><b>ต่างจาก comparative:</b> taller than (2 สิ่ง) vs the tallest (3 สิ่งขึ้นไป) ❌ most beautifulest ❌ more happiest ❌ baddest<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>1) They were the ___ (sad) family → <b>saddest</b><br>2) the ___ (beautiful) garden → <b>most beautiful</b><br>3) the ___ (happy) → <b>happiest</b><br>4) the ___ (bad) land → <b>worst</b></details>"]], "5": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Progressive (Past Continuous)", "<b>ความหมาย:</b> การกระทำที่ \"กำลังดำเนินอยู่\" ณ เวลาหนึ่งในอดีต (คู่มือหน้า 69) ใช้ \"วาดภาพ\" ฉากในเรื่อง<br><b>โครงสร้าง:</b> S + <b>was / were</b> + V-ing<br>• I/he/she/it/เอกพจน์ → was &nbsp;• you/we/they/พหูพจน์ → were<br><b>ปฏิเสธ:</b> was not / were not + V-ing &nbsp; <b>คำถาม:</b> Was he napping? / What was he doing?<br><b>เติม -ing:</b> nap→napping (ซ้ำ p), run→running, make→making (ตัด e), play→playing, lie→lying<br><b>ใช้คู่กับ Past Simple (เหตุการณ์ที่มาขัด):</b> Past Progressive (กำลังทำ) + <b>when</b> + Past Simple (เหตุการณ์สั้นๆ)<br>• <i>The rabbit <u>was napping</u> when a loud sound <u>jolted</u> him awake.</i><br>• <i>Koravich <u>was baking</u> a cake when his mom <u>called</u>.</i><br><b>ตัวอย่างจากเรื่อง:</b> Panicking rabbits <u>were running</u> behind him. / The animals <u>were rushing</u> toward a cliff.<br><b>Noun vs Verb (Practice E ในคู่มือ):</b> sound (นาม) / sounded (กริยา), nap (นาม) / napping (V-ing), scream (นาม/กริยา) — ดูตำแหน่ง: หลัง a/the/adj = นาม, หลังประธาน = กริยา<br><b>ข้อผิดที่พบบ่อย:</b> ❌ was run (ขาด -ing) ❌ They was playing (ต้อง were) ❌ I am reading when... (ต้อง was reading)<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>I ___ my book when the teacher called → <b>was reading</b><br>They ___ playing when parents arrived → <b>were</b><br>A ___ (sound/sounded) jolted the rabbit awake → <b>sound</b> (นาม หลัง adj)</details>"]], "6": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Progressive + Past Simple (when / while / as)", "<b>สูตรหลัก:</b> S + was/were + V-ing + <b>when</b> + S + Past Simple<br>• The woodcutter <u>was chopping</u> a tree <b>when</b> he <u>slipped</u>. (กำลังตัด → ลื่น)<br><b>3 คำเชื่อม:</b> <b>when</b> (ตอนที่) / <b>while</b> + Past Progressive (ในขณะที่ กำลัง...) / <b>as</b> (ขณะที่) เช่น <i>While he was chopping, the ax slipped.</i> = <i>As he was chopping at the tree, he slipped.</i> (ในเรื่องใช้ As)<br><b>แยกให้ออก:</b> การกระทำยาว/กำลังดำเนินอยู่ = Past Progressive; การกระทำสั้น/ขัดจังหวะ = Past Simple<br><b>รูปแบบตอบคำถาม (คู่มือหน้า 75):</b> Q: What was the woodcutter doing when he lost his ax? → A: <i>He was chopping a tree when he lost his ax.</i> (ประธาน + was/were + V-ing + when + Past Simple)<br><b>Future ในคำพูดวิญญาณ:</b> \"I <b>will find</b> your ax.\" (will + V1 = สัญญา/ตัดสินใจ)<br><b>กริยาไม่ปกติในเรื่อง:</b> bring→brought, give→gave, come→came, put→put, throw→threw, find→found, go→went<br><b>ข้อผิดที่พบบ่อย:</b> ❌ While he chopped the tree, the ax slipped (ใช้ได้ แต่ไม่เน้น \"กำลัง\") ✅ While he <u>was chopping</u> ... ❌ will found ✅ will find<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>While he ___ (chop) wood, the ax slipped → <b>was chopping</b><br>The spirit ___ (bring) the ax up → <b>brought</b><br>What was the neighbor doing? → <b>He was chopping a tree / crying.</b></details>"]], "7": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Simple เล่าเรื่องต่อเนื่อง + Sequencing", "<b>เรื่องนี้ใช้ Past Simple ล้วน</b> เรียงเหตุการณ์ตามลำดับ: walked → reached → lay down → heard → looked → drank → fell asleep → woke up<br><b>Sequence words:</b> One day / Suddenly / Then / Soon / Slowly / After that / Finally / Twenty years later<br>• <i>Suddenly, he <u>heard</u> a voice calling out.</i> (Suddenly + Past Simple)<br><b>กริยาไม่ปกติสำคัญ:</b> lie→<b>lay</b> (นอนลง) | lay→laid (วาง) | lie→lied (โกหก) ✨ <br>hear→heard, see→saw, take→took, wake→woke, fall→fell, find→found, have→had, drink→drank, go→went, grow→grew, think→thought<br><b>Regular:</b> look→looked, help→helped, hurry→hurried, stare→stared, obey→obeyed<br><b>Adjectives บรรยายตัวละคร:</b> lazy, kind, good-natured, old, short, grizzled — adjective วางหน้านาม (a <u>short</u>, <u>old</u> man) หรือหลัง be (Rip was <u>lazy</u>)<br><b>ข้อผิดที่พบบ่อย:</b> ❌ He didn't knew ✅ didn't know &nbsp; ❌ waked up ✅ woke up<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>Rip ___ down and began daydreaming → <b>lay</b><br>Suddenly he ___ a voice → <b>heard</b><br>Rip ___ up twenty years later → <b>woke</b></details>"]], "8": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Simple + Past Progressive + didn't + V1", "<b>1) Past Progressive (ฉากที่กำลังเกิดขึ้น):</b> Jeremy <u>was flying</u> over the desert when the engine <u>broke down</u>. (กำลังบิน → เครื่องเสีย)<br><b>2) Past Simple (เหตุการณ์ต่อเนื่อง):</b> broke down → started to drop → crashed → climbed out → looked around<br><b>3) ปฏิเสธอดีต:</b> didn't / did not + <b>V1</b>: He <u>didn't know</u> where he was going. | had no water (=didn't have any water)<br><b>4) Adjective:</b> elegant (สง่างาม), thirsty, soft, luxurious, silly — วางหลัง be/ก่อนนาม: <i>an elegant-looking man</i>, <i>He was very thirsty.</i><br><b>5) Be-verb อดีต:</b> The sand <u>was</u> soft. / The shape <u>was</u> getting bigger. (was + V-ing ก็ได้)<br><b>6) คำเชื่อม:</b> but / so / then / when เช่น He was thirsty, <b>so</b> he asked for water. | You can't come in <b>without</b> a tie. (without + นาม)<br><b>ข้อผิดที่พบบ่อย:</b> ❌ He didn't knew ✅ didn't know &nbsp; ❌ The plane crash ✅ crashed<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>Jeremy ___ (fly) over the desert when the engine broke down → <b>was flying</b><br>He didn't ___ (know) where → <b>know</b><br>The plane ___ into the sand → <b>crashed</b></details>"]], "9": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Simple: เลือกรูปกริยาให้ถูก (ตามแบบฝึกในคู่มือ)", "<b>วิธีคิด 3 ขั้น:</b> ① ดูเวลา (once upon a time / one day = อดีต) ② ดูประธานและ did/didn't ③ เลือกรูป V2 หรือ V1<br><b>ตัวเลือกในคู่มือ:</b> The boy ___ himself → <b>prepared</b> (ไม่ใช่ preparing/prepare) | The crowd ___ → <b>gathered</b> | The little boy ___ proud → <b>felt</b> (ไม่ใช่ fell) | The wise man ___ still → <b>remained</b> | The race ___ → <b>started</b><br><b>เหตุผล:</b> ในประโยคที่ไม่มี did/was/will ต้องเป็น V2 ➜ -ed (regular) หรือรูปไม่ปกติ<br><b>คู่สับสน:</b> felt (รู้สึก, V2 ของ feel) vs fell (ล้ม/ตก, V2 ของ fall) | won (V2 ของ win) vs one | threw/through<br><b>Superlative / Comparative เสริม:</b> best, wisest, the most important; ❌ most good ✅ best<br><b>ตัวอย่างจากเรื่อง:</b> The crowd <u>cheered</u> and <u>waved</u>. / He <u>crossed</u> the winning line and <u>finished</u> first. / The wise man <u>smiled</u> gently.<br><b>คำเรียงเวลา:</b> once again / then / this time / at the end — ใช้กับ Past Simple<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>The boy ___ (win) the first race → <b>won</b><br>The crowd ___ (cheer) → <b>cheered</b><br>The little boy ___ (feel) proud → <b>felt</b></details>"]], "10": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Progressive + Past Simple + will + Conditional (If)", "<b>1) Past Progressive + Past Simple:</b> Win <u>was studying</u> when the wind <u>blew</u>. (กำลังเรียน → ลมพัด) | One evening, Win <u>was studying</u>. He felt bored, <b>so</b> he started whistling.<br><b>2) Past Simple ต่อเนื่อง:</b> felt → started → chirped → shook → screamed → stopped → looked → smiled<br><b>3) Look + adjective:</b> She <u>looked</u> serious. (ดูเหมือน) ✅ look + adj, ไม่ใช่ look + adverb<br><b>4) Conditional ตามความเชื่อ (If):</b> If + Present Simple, <b>will + V1</b>: <i>If a gecko makes three sounds, something bad <u>will happen</u>.</i> | <i>If you spill salt, throw some over your shoulder.</i> (คำสั่ง)<br><b>5) คำสั่ง/ห้าม:</b> Don't + V1 (Don't whistle at night) | Never + V1 (Never whistle at night)<br><b>6) Superlative:</b> wise→wisest, the most careful<br><b>7) คำเชื่อม:</b> so (ผล), because (เหตุ), but (ขัดแย้ง): He didn't believe, <b>but</b> he felt nervous.<br><b>ข้อผิดที่พบบ่อย:</b> ❌ If it will rain... ✅ If it rains, ... (ไม่ใช้ will ในส่วน if) ❌ He look at the door ✅ looked<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>Win ___ (study) when the wind blew → <b>was studying</b><br>If a gecko makes three sounds, something bad ___ happen → <b>will</b><br>She ___ serious → <b>looked</b></details>"]], "11": [["📘 บทเรียน Grammar (ตามคู่มือ GEN67-121): Past Progressive + Past Simple + Word Order + Connectors", "<b>1) Past Progressive ฉากน้ำท่วม:</b> People <u>were shouting</u> and <u>running</u> through the water. | The water level <u>was rising</u> fast. (the water level เอกพจน์ = was)<br><b>2) Past Simple ลำดับเหตุการณ์:</b> heard → cried → ran → grabbed → climbed → fell asleep; overflow→overflowed, grab→grabbed (ซ้ำ b), swim→swam, run→ran, slip→slipped (ซ้ำ p)<br><b>3) คำเชื่อมในเรื่อง:</b> because (เพราะ: ... <i>because the river overflowed every year</i>), but (แต่: <i>but the land was fertile</i>), so (จึง)<br><b>4) Fix the Word Order (Part 3 ในคู่มือ):</b> ลำดับ <b>S + V + O + Place + Time</b> (ประธาน-กริยา-กรรม-สถานที่-เวลา)<br>เช่น fast / was / the / rising / water level → <i>The water level was rising fast.</i><br>• Be-verb ตามหลังประธาน • Adjective มาก่อนนาม • Adverb (fast) มักอยู่ท้ายประโยค<br><b>5) มีคำ -ed เป็นคุณศัพท์:</b> terrified, muddy, curled up — คำพวกนี้บอกความรู้สึก/สภาพ (Jaran felt <u>terrified</u>)<br><b>ข้อผิดที่พบบ่อย:</b> ❌ People was shouting ✅ were shouting &nbsp; ❌ He swimmed ✅ swam &nbsp; ❌ The water level were rising ✅ was rising<br><details><summary><b>✍️ เช็กตัวเอง (กดดูเฉลย)</b></summary>Jaran ___ (grab) his clothes → <b>grabbed</b><br>The water level ___ rising fast → <b>was</b><br>rushing / the / water / was → <b>The water was rushing.</b></details>"]]};for(const k in GD){C[k].G.unshift(...GD[k])}
C.forEach(c=>{const seen=new Set();c.q=c.q.filter(q=>!seen.has(q[0])&&seen.add(q[0]))});
function explain(c){const qs=m.querySelectorAll('.q');c.q.forEach((q,k)=>{const old=qs[k].querySelector('.ex');if(old)old.remove();const d=document.createElement('div');d.className='ex';d.style.cssText='margin-top:6px;padding:8px 10px;border-left:4px solid var(--ok);background:var(--soft);border-radius:6px;font-size:.92rem';d.innerHTML='✅ <b>เฉลย: '+q[1][q[2]]+'</b><br>💡 '+(EXP[q[0]]||'ทบทวนกล่อง grammar และคำศัพท์ของบทนี้');qs[k].appendChild(d)})}
const nav=document.getElementById('nav'),m=document.getElementById('m');
C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.n||(i?'Story '+i:'บทนำ');b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){
const c=C[i];[...nav.children].forEach((b,j)=>b.classList.toggle('on',i==j));
const rows=c.v.split(';').map(x=>x.split('|')).map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join('');
const G=(c.G||[c.g]).map(g=>`<div class="card gram"><h3>📐 ${g[0]}</h3><p>${g[1]}</p></div>`).join('');
m.innerHTML=`<div class="card"><h2>${c.t}</h2><p>📝 ${c.s}</p></div>
<div class="card"><h3>🔤 แปลทีละประโยค (EN → TH)</h3>${c.l.map(x=>{const a=x.split('|');return `<div class="ln"><div class="en">${a[0]}</div><div class="th">➜ ${a[1]}</div></div>`}).join('')}</div>
<div class="card"><h3>⭐ Vocabulary สำคัญ (${c.v.split(';').length} คำ)</h3><div class="tbl"><table>${rows}</table></div></div>${G}
<div class="card"><h3>✏️ ข้อสอบประจำบท (${c.q.length} ข้อ)</h3>${c.q.map((q,k)=>{const o=q[1].map((_,j)=>j).sort(()=>Math.random()-.5);return `<div class="q"><b>${k+1}. ${q[0]}</b>${o.map((j,p)=>`<label><input type="radio" name="q${k}" value="${j}"> ${'abcd'[p]}. ${q[1][j]}</label>`).join('')}</div>`}).join('')}
<button class="btn" id="chk">ตรวจคำตอบ</button><span id="sc"></span></div>`;
document.getElementById('chk').onclick=()=>{explain(c);let s=0;c.q.forEach((q,k)=>{document.querySelectorAll(`input[name=q${k}]`).forEach(r=>{const ok=r.value==q[2];r.parentElement.className=ok?'ok':(r.checked?'no':'');if(r.checked&&ok)s++})});document.getElementById('sc').textContent=`คะแนน ${s}/${c.q.length}`};
scrollTo(0,0)}
show(0);
</script></body></html>
